[package]
name = "ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI bindings surface for iOS / Android platform integration."

[features]
default = []
# Pulls in `inference_router/http-client`, enabling the real reqwest-based
# `HttpLlamaServerClient` so the FFI runtime can wire `trigger_synthesis`
# to a live llama.cpp loopback server. Without this feature the runtime
# still constructs an `InferenceRouter` (MLX + Fallback adapters) so
# classification tasks work, but synthesis tasks return `Unavailable`
# because the llama.cpp adapter has no client.
http-client = ["inference_router/http-client"]
# Pulls in `tracing-subscriber` and exposes `tracing_init::try_init_tracing`
# so platform hosts can install a global tracing subscriber from the
# substrate without taking a direct dependency on `tracing-subscriber`
# themselves. Without this feature the substrate still emits tracing
# events via the `tracing` facade but no subscriber is installed by
# default — hosts can register their own or accept the "events go
# nowhere" library-side default.
tracing-subscriber = ["dep:tracing-subscriber"]

[dependencies]
crypto = { path = "../crypto" }
evidence_store = { path = "../evidence_store" }
inference_router = { path = "../inference_router" }
memory_manager = { path = "../memory_manager" }
synthesis_pipeline = { path = "../synthesis_pipeline" }

chrono = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
