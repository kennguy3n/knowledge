[package]
name = "ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI bindings surface for iOS / Android platform integration."

# Multiple library kinds:
#   * `lib` — the standard rlib, used by every downstream Rust crate
#     in the workspace (`crates/napi`, `crates/integration_tests`, the
#     in-tree `ffi` unit tests) so they can call the public FFI
#     functions directly without going through a C ABI shim. The
#     `napi_addon` crate consumes this via `use ffi::...`, so the
#     lib name MUST stay at the default (`ffi`, matching the package
#     name). Renaming the lib here would break that import path.
#   * `staticlib` — the static `libffi.a` that `cargo swift package`
#     links into the iOS `.xcframework`. UniFFI's iOS pipeline expects
#     a static archive (Apple's linker rules around dylibs inside an
#     `.xcframework` are too strict to use a cdylib here).
#   * `cdylib` — the shared `libffi.so` that `cargo ndk` packages into
#     the Android `jniLibs/` directory. UniFFI's generated Kotlin
#     bindings include `System.loadLibrary("ffi")` matching this name.
[lib]
crate-type = ["lib", "staticlib", "cdylib"]

# The `uniffi-bindgen` binary used to live here as a `[[bin]]`
# target, but that forced the `cli` feature on the workspace
# `uniffi` dependency (which transitively pulls `clap` / `syn` /
# `quote` / `proc-macro2`) into THIS crate's dependency graph,
# including its `staticlib` (iOS `.xcframework`) and `cdylib`
# (Android `jniLibs/`) outputs. The binary now lives in its own
# `crates/uniffi-bindgen` workspace crate; the build scripts invoke
# it with `cargo run -p uniffi-bindgen`, which builds only that
# crate's dependency graph. See `crates/uniffi-bindgen/Cargo.toml`
# for the rationale.

[features]
default = []
# Pulls in `inference_router/http-client` AND
# `connector_framework/http-client`, enabling:
#   * the real reqwest-based `HttpLlamaServerClient` so the FFI runtime
#     can wire `trigger_synthesis` to a live llama.cpp loopback server;
#   * the real `BlockingHttpTransport` (reqwest blocking client with
#     retry-with-backoff + Retry-After honoring) and the production
#     `OAuth2Client` so `create_connector` / `authenticate_connector` /
#     `sync_connector` actually talk to source providers instead of
#     synthesizing fixture data.
# Without this feature the runtime still constructs an
# `InferenceRouter` (MLX + Fallback adapters) so classification tasks
# work, and connector-management FFI functions still link, but every
# connector call returns `FfiError::Unavailable { subsystem: "connector-http-client" }`
# because the transport / OAuth2 client could not be instantiated.
http-client = [
    "inference_router/http-client",
    "connector_framework/http-client",
    "synthesis_engine/http-client",
]
# Pulls in `tracing-subscriber` and exposes `tracing_init::try_init_tracing`
# so platform hosts can install a global tracing subscriber from the
# substrate without taking a direct dependency on `tracing-subscriber`
# themselves. Without this feature the substrate still emits tracing
# events via the `tracing` facade but no subscriber is installed by
# default — hosts can register their own or accept the "events go
# nowhere" library-side default.
tracing-subscriber = ["dep:tracing-subscriber"]

[dependencies]
connectors = { path = "../connectors" }
# `async-runtime` + `webhook-server` are pulled in unconditionally so
# the substrate's server-side webhook-reception module (the
# `connector_framework::webhook_server` axum service that fans
# incoming provider webhooks to the per-connector
# `handle_webhook_event` calls) is compiled into every FFI build.
# `http-client` is gated on this crate's `http-client` feature so the
# blocking reqwest transport is only linked into production builds.
connector_framework = { path = "../connector_framework", features = [
    "async-runtime",
    "webhook-server",
] }
crypto = { path = "../crypto" }
evidence_store = { path = "../evidence_store" }
inference_router = { path = "../inference_router" }
memory_manager = { path = "../memory_manager" }
synthesis_engine = { path = "../synthesis_engine" }
synthesis_pipeline = { path = "../synthesis_pipeline" }

chrono = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
uniffi = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

# Phase 5 webhook receiver wiring — the FFI surface owns the tokio
# runtime that drives the framework-layer `WebhookServer` (axum) per
# server instance, builds the `Arc<dyn WebhookDispatcher>` that fans
# `POST /webhooks/{provider_id}` into the in-memory connector
# registry, and synchronously joins the server thread on
# `stop_webhook_server` / `close_store` so SQLCipher and the master
# key are torn down only after every in-flight dispatch has drained.
# The framework crate already declares these via its `webhook-server`
# feature, but the FFI uses the types directly (constructing
# `WebhookServerConfig`, `WebhookDispatch`, implementing
# `WebhookDispatcher`, awaiting `oneshot::Receiver`, spawning blocking
# work via `tokio::task::spawn_blocking`) so they need to be direct
# deps of this crate too.
async-trait = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Enable `evidence_store/test-support` for the dev profile so unit
# tests in this crate can drive
# `EvidenceStore::inject_with_transaction_failure_for_tests` (see the
# `apply_dispatch_outcome_tx_failure_marks_window_failed` regression
# test in `synthesis.rs`). The production dependency above stays on
# the default feature set so release builds never compile the hook.
evidence_store = { path = "../evidence_store", features = ["test-support"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
