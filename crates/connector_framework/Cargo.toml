[package]
name = "connector_framework"
description = "Connector framework for the Knowledge substrate: OAuth2 token vault, sync state, webhook subscriptions, channel-scoped attachments, and ACL sync from external source systems."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enables the reqwest-backed `BlockingHttpTransport` and
# `ReqwestOAuth2CodeExchange` / `ReqwestTokenRefresher`. Gated so
# CI hosts without the reqwest / rustls build chain (cross-checks,
# offline lints) can still compile the crate against fixtures.
http-client = ["dep:reqwest"]
# Exposes test-only helpers (`MockHttpTransport`, fixture-driven
# connector knobs) outside `cfg(test)` so neighbouring crates'
# integration tests can reach them. Production builds leave this
# off so the helpers stay unreachable from the FFI surface.
test-support = []

[dependencies]
crypto = { path = "../crypto" }
evidence_store = { path = "../evidence_store" }
observation_engine = { path = "../observation_engine" }
permission_service = { path = "../permission_service" }

thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
reqwest = { workspace = true, optional = true }

[lints]
workspace = true
