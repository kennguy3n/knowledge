[package]
name = "connector_framework"
description = "Connector framework for the Knowledge substrate: OAuth2 token vault, sync state, webhook subscriptions, channel-scoped attachments, and ACL sync from external source systems."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enables the reqwest-backed `BlockingHttpTransport` and
# `ReqwestOAuth2CodeExchange` / `ReqwestTokenRefresher`. Gated so
# CI hosts without the reqwest / rustls build chain (cross-checks,
# offline lints) can still compile the crate against fixtures.
#
# Pulls in `reqwest/blocking` explicitly so an async-only build
# (only `async-http-client` enabled) does NOT transitively pull in
# reqwest's blocking client + its dedicated thread pool. See the
# rationale on the workspace-level `reqwest` dep in the root
# Cargo.toml.
http-client = ["dep:reqwest", "reqwest/blocking"]
# Exposes test-only helpers (`MockHttpTransport`, fixture-driven
# connector knobs) outside `cfg(test)` so neighbouring crates'
# integration tests can reach them. Production builds leave this
# off so the helpers stay unreachable from the FFI surface.
test-support = []
# Phase 5 async surface. Pulls in `tokio`, `async-trait`, and the
# async reqwest client so the substrate can drive connectors from a
# tokio runtime instead of `std::thread`-based polling. The
# pre-existing `Connector` trait + `BlockingHttpTransport` stay
# unmodified — the async layer is additive and is built on top of
# them via the `BlockingConnectorAdapter` bridge.
async-runtime = ["dep:tokio", "dep:async-trait"]
# Phase 5 async HTTP transport. Independent of `http-client` so
# offline cross-checks can build the async surface without the
# blocking client. Adds reqwest with only the async features
# enabled — `reqwest/blocking` (and its dedicated thread pool) is
# opted into solely by the sync `http-client` feature above, so an
# `async-http-client`-only build never links the blocking client.
async-http-client = ["async-runtime", "dep:reqwest"]
# Phase 5 webhook receiver server. Built on `axum` + `hyper` +
# `tower`. Gated separately from `async-runtime` so a substrate
# embedding the connector framework purely as a client (e.g. the
# desktop host that subscribes to webhooks via a cloud relay) can
# still build without the server crates.
webhook-server = ["async-runtime", "dep:axum", "dep:tower", "dep:hyper", "dep:hyper-util"]

[dependencies]
crypto = { path = "../crypto" }
evidence_store = { path = "../evidence_store" }
observation_engine = { path = "../observation_engine" }
permission_service = { path = "../permission_service" }

thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# The `webhook-server` tests in `src/webhook_server.rs` spin up an
# axum server on `127.0.0.1:0` and drive it with an async reqwest
# client. Declared here (not on the `webhook-server` feature) so
# the runtime dependency footprint of `webhook-server` stays
# minimal — `reqwest` is only linked into the test binaries.
reqwest = { workspace = true }

[lints]
workspace = true
