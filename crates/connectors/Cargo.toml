[package]
name = "connectors"
description = "Vendor-specific connector implementations for the Knowledge substrate (Google Drive, OneDrive, Notion, Jira, Confluence, Figma, HubSpot, Slack, Email)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Pulls in the framework's reqwest-backed `BlockingHttpTransport`
# and `default_oauth_client`. The connector crates themselves do
# not depend on reqwest directly — every HTTP call goes through
# the `connector_framework::HttpTransport` trait object — so
# enabling this feature just transitively pulls reqwest into the
# substrate's dependency graph.
http-client = ["connector_framework/http-client"]
# Exposes `MockHttpTransport` outside `cfg(test)` so neighbouring
# crates' integration tests can drive each connector with canned
# JSON responses. The framework also gates `MockHttpTransport`
# under `test-support`, so this feature is a thin pass-through.
test-support = ["connector_framework/test-support"]
# Opt-in flag for the live-integration test harness
# (`tests/live_integration.rs`). Without this feature, the live
# tests are gated out at compile time so a default `cargo test`
# never accidentally hits a real provider API or trips on a
# missing reqwest dependency. With it on, the harness compiles
# against the framework's `BlockingHttpTransport` and short-
# circuits at runtime if the per-provider env var is unset.
live-integration = ["http-client"]

[dependencies]
connector_framework = { path = "../connector_framework" }
crypto = { path = "../crypto" }
evidence_store = { path = "../evidence_store" }
observation_engine = { path = "../observation_engine" }

thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# HMAC-SHA256 request signing for the Vietnam marketplace connectors
# (Tiki, Shopee, Lazada). The RustCrypto `hmac`/`sha2` pair is already
# pinned in lockstep at the workspace root (see the crypto crate).
hmac = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Re-pin the framework with both test-support (MockHttpTransport)
# and http-client (BlockingHttpTransport) so the unit-test layer
# keeps using mocks while `tests/live_integration.rs` can opt into
# the real reqwest-backed transport when the `live-integration`
# feature is on.
connector_framework = { path = "../connector_framework", features = ["test-support", "http-client"] }
chrono = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true

# Cargo refuses to build an integration test if its source file is
# missing on disk for the feature combo currently selected, so we
# leave the file present but the test bodies gate themselves out
# with `#[cfg(feature = "live-integration")]`.
[[test]]
name = "live_integration"
path = "tests/live_integration.rs"
