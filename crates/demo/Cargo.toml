[package]
name = "demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "demo"
path = "src/main.rs"

[dependencies]
agent_contract = { path = "../agent_contract" }
audit_service = { path = "../audit_service" }
concept_graph = { path = "../concept_graph" }
connector_framework = { path = "../connector_framework" }
connectors = { path = "../connectors" }
# The demo is explicitly a test / scaffolding driver — it directly
# constructs `TestSigner` and `NoOpSynthesizer`, so it enables the
# `test-support` features that expose them. Production binaries that
# do not need these mocks omit the feature.
crypto = { path = "../crypto", features = ["test-support"] }
evidence_store = { path = "../evidence_store" }
export_plane = { path = "../export_plane" }
inference_router = { path = "../inference_router" }
memory_manager = { path = "../memory_manager" }
observation_engine = { path = "../observation_engine" }
permission_service = { path = "../permission_service" }
reasoning_engine = { path = "../reasoning_engine" }
synthesis_engine = { path = "../synthesis_engine", features = ["test-support"] }
synthesis_pipeline = { path = "../synthesis_pipeline", features = ["test-support"] }
tenant_service = { path = "../tenant_service" }

chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
