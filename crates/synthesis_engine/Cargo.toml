[package]
name = "synthesis_engine"
description = "Server-side synthesis engine for the Knowledge substrate. Wraps a SynthesisWindowManager with hierarchy-enforced inputs (channel -> domain -> tenant), ships a deterministic test stub, a production HTTP managed-endpoint synthesizer (with a blocking reqwest adapter behind the http-client feature), and a TEE-attested wrapper that adds scope-binding enforcement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enables `MockTeeRuntime` — a deterministic mock implementation of
# the `TeeRuntime` trait used by tests and demos. Gated out of
# default `cargo build` artifacts so production binaries do not ship
# the mock TEE runtime.
test-support = []
# Pulls in `reqwest::blocking` and exposes
# [`crate::managed_endpoint::BlockingHttpClientAdapter`] — the
# production `HttpClient` impl used by the FFI substrate's
# `configure_synthesis_engine` entry point to dispatch synthesis
# requests through a real HTTPS endpoint. Gated so cross-checks
# and offline lints that do not link the network stack can still
# build the engine; without this feature
# `configure_synthesis_engine` returns
# `FfiError::Unavailable { subsystem: "synthesis_engine" }`.
http-client = ["dep:reqwest"]
# Pulls in `aws-nitro-enclaves-nsm-api` + `ciborium` and exposes
# [`crate::tee_runtime_nitro::NitroTeeRuntime`] — the production
# `TeeRuntime` impl that talks to the on-host Nitro Secure Module
# (NSM) and parses the returned COSE_Sign1 attestation document
# to extract PCR0 as the report's measurement. Gated because the
# nsm-api crate links the NSM kernel-driver shim which is only
# meaningful inside a running enclave; non-enclave builds keep
# `MockTeeRuntime` as the only `TeeRuntime` impl and stay free
# of the linker dependency.
nitro-tee = ["dep:aws-nitro-enclaves-nsm-api", "dep:ciborium", "dep:serde_bytes"]

[dependencies]
crypto = { path = "../crypto" }
evidence_store = { path = "../evidence_store" }
memory_manager = { path = "../memory_manager" }
synthesis_pipeline = { path = "../synthesis_pipeline" }

thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Zeroize-on-drop for the plaintext / key-derived synthesis
# intermediates the TEE worker materialises inside the confidential
# boundary (`tee_worker.rs`). Reuses the workspace pin so the wipe
# discipline matches `crates/crypto`'s secret-key handling.
zeroize = { workspace = true }
# Optional: only linked when the `http-client` feature is enabled.
# We reuse the workspace `reqwest` pin (default-features off, json +
# rustls-tls on) and additionally request the `blocking` feature so
# the sync `HttpClient::send` adapter does not need to thread an
# async runtime through the synthesis engine surface.
reqwest = { workspace = true, features = ["blocking"], optional = true }
# Optional: only linked when the `nitro-tee` feature is enabled.
# Talks to /dev/nsm to request attestation documents from the AWS
# Nitro Secure Module. Pinned to the 0.4.x line for two coordinated
# reasons: (1) it tracks the same minor the upstream
# `aws-nitro-enclaves-cose` crate targets, so future bumps stay
# coordinated; (2) `0.5.0` raised `rust-version` to `1.92`, well
# beyond the workspace's `MSRV (1.85.0)` CI gate, so bumping to
# `0.5+` is gated on a workspace MSRV bump. The matching Dependabot
# ignore lives in `.github/dependabot.yml`.
aws-nitro-enclaves-nsm-api = { version = "0.4", optional = true }
# Optional: only linked when the `nitro-tee` feature is enabled.
# Used to decode the CBOR-encoded COSE_Sign1 attestation document
# returned by the NSM driver so we can extract PCR0 (the enclave
# measurement) and the nonce echo. `ciborium` is the
# de-serde-team maintained CBOR codec; chosen over the archived
# `serde_cbor` crate.
ciborium = { version = "0.2", optional = true }
# Optional: only linked when the `nitro-tee` feature is enabled.
# `aws-nitro-enclaves-nsm-api`'s `Request::Attestation` variant is
# typed against `serde_bytes::ByteBuf`, so we add the matching
# `serde_bytes 0.11` line directly rather than relying on the
# transitive resolve picking the right minor.
serde_bytes = { version = "0.11", optional = true }

# Unix-only: `mlock(2)` / `munlock(2)` for the TEE worker's
# enclave-page pre-faulting hook (`tee_worker.rs`). Locking the
# pre-faulted working set keeps it resident so synthesis calls do
# not incur first-touch page faults that leak access patterns via
# timing. Guarded behind `cfg(unix)`; the non-unix path is a safe
# no-op so the mock / non-enclave path still builds and tests run.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
concept_graph = { path = "../concept_graph" }
permission_service = { path = "../permission_service" }
audit_service = { path = "../audit_service" }
tempfile = { workspace = true }
# Integration tests under `tests/` drive the engine end-to-end using
# `synthesis_pipeline::NoOpSynthesizer` and `crypto::TestSigner` /
# `crypto::TEST_SIGNER_KEY_LEN`. Enable the `test-support` feature on
# both crates so the gated mock types are visible while compiling the
# test binaries. (cfg(test) on the test binary does NOT propagate to
# library dependencies — only `--all-features` or explicit feature
# overrides activate the gates.)
synthesis_pipeline = { path = "../synthesis_pipeline", features = ["test-support"] }
crypto = { path = "../crypto", features = ["test-support"] }

[lints]
workspace = true
