[package]
name = "inference_router"
description = "On-device SLM inference routing for the Knowledge substrate (MLX → llama.cpp → fallback)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enables the real HTTP transport for the llama.cpp loopback server
# (`HttpLlamaServerClient` in `adapters::llama_cpp`). Pulls in
# `reqwest` with the blocking client. Gated behind a feature so the
# substrate's unit-test suite stays free of network deps and so the
# crate can compile on hosts without the `reqwest` build chain
# (e.g. CI shells that don't link OpenSSL / rustls).
#
# Opts in to `reqwest/blocking` explicitly so an `async-http-client`-only
# build does NOT transitively pull in the blocking client + its
# dedicated thread pool. See the rationale on the workspace-level
# `reqwest` dep in the root Cargo.toml.
http-client = ["dep:reqwest", "reqwest/blocking"]
# Async surface for the llama.cpp loopback server. Adds
# `AsyncHttpLlamaServerClient`, which uses async reqwest under a
# tokio runtime instead of the blocking thread per request. Gated
# separately from `http-client` so cross-checks that link the
# blocking client still build, and so callers that only want the
# async path can opt out of the blocking client entirely (no
# `reqwest/blocking` here — the workspace-level reqwest dep no
# longer ships blocking by default).
async-http-client = ["dep:reqwest", "dep:tokio", "dep:async-trait"]
# Exposes test-only helpers (e.g. `clear_mlx_generate_fn`) outside
# `cfg(test)` so neighbouring crates' integration tests can reach
# them. Production builds leave this off so the helpers are
# unreachable from the FFI surface.
test-support = []

[dependencies]
crypto = { path = "../crypto" }
chrono = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
