[package]
name = "crypto"
description = "Knowledge substrate post-quantum cryptographic primitives (BLAKE3, XChaCha20-Poly1305, hybrid X25519 + ML-KEM-768)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enables `StubKemBackend`, `TestSigner`, and `TEST_SIGNER_KEY_LEN`.
# These are mock implementations of `KemBackend` / `ProvenanceSigner`
# used by tests, benches, and demos. They are gated out of default
# builds so production binaries do not ship them.
test-support = []

[dependencies]
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
x25519-dalek = { workspace = true }
ml-kem = { workspace = true }
ml-dsa = { workspace = true }
pqcrypto-sphincsplus = { workspace = true }
pqcrypto-traits = { workspace = true }
rand_core = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
serde_json = { workspace = true }
# Self-referential dev-dep: enables the `test-support` feature when
# compiling integration tests under `tests/`. Cargo's `cfg(test)` flag
# is only set on the test binary, NOT on the library it links against,
# so without this override `cargo test -p crypto` would fail to resolve
# `TestSigner` / `TEST_SIGNER_KEY_LEN` / `StubKemBackend` in the
# integration test crates. This is the same pattern tokio / serde use.
crypto = { path = ".", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
float_cmp = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
ignored_unit_patterns = "allow"
explicit_iter_loop = "allow"
needless_raw_string_hashes = "allow"
type_complexity = "allow"
single_match = "allow"
items_after_statements = "allow"
unreadable_literal = "allow"
uninlined_format_args = "allow"
needless_continue = "allow"
match_same_arms = "allow"
# Re-enable cast lints that are security-critical for crypto code.
# These are suppressed workspace-wide for convenience but must be
# enforced in this crate to prevent silent truncation / sign-flip
# bugs in key-length arithmetic and epoch-size calculations.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
