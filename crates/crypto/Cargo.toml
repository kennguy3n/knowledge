[package]
name = "crypto"
description = "Knowledge substrate post-quantum cryptographic primitives (BLAKE3, XChaCha20-Poly1305, hybrid X25519 + ML-KEM-768)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enables `StubKemBackend`, `TestSigner`, `TEST_SIGNER_KEY_LEN`, and
# `DeterministicEpochKeySource`. These are mock implementations of
# `KemBackend` / `ProvenanceSigner` / `EpochKeySource` used by tests,
# benches, and demos. They are gated out of default builds so
# production binaries do not ship them, and a `compile_error!` in
# `src/lib.rs` rejects enabling this feature in release builds.
test-support = []

[dependencies]
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
x25519-dalek = { workspace = true }
ml-kem = { workspace = true }
ml-dsa = { workspace = true }
pqcrypto-sphincsplus = { workspace = true }
pqcrypto-traits = { workspace = true }
rand_core = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }
# Self-referential dev-dep: enables the `test-support` feature when
# compiling integration tests under `tests/`. Cargo's `cfg(test)` flag
# is only set on the test binary, NOT on the library it links against,
# so without this override `cargo test -p crypto` would fail to resolve
# `TestSigner` / `TEST_SIGNER_KEY_LEN` / `StubKemBackend` in the
# integration test crates. This is the same pattern tokio / serde use.
crypto = { path = ".", features = ["test-support"] }

# Criterion benchmark harness for the hot crypto paths
# (AEAD / hybrid KEM / content hash / KDF / signatures). `harness =
# false` disables libtest so criterion's own main function runs.
[[bench]]
name = "crypto_bench"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
ignored_unit_patterns = "allow"
explicit_iter_loop = "allow"
needless_raw_string_hashes = "allow"
type_complexity = "allow"
single_match = "allow"
items_after_statements = "allow"
unreadable_literal = "allow"
uninlined_format_args = "allow"
needless_continue = "allow"
match_same_arms = "allow"
# Re-enable the four safety-relevant numeric-conversion +
# comparison lints. These match the workspace-level deny (see
# Cargo.toml:203-206) but are restated here because the crypto
# crate does NOT inherit `[lints] workspace = true` — it
# maintains its own fully independent block. Keeping the
# explicit deny here means the crate's policy survives even if
# a maintainer ever removes the workspace-level deny.
#
# Enforced to prevent silent truncation / sign-flip bugs in
# key-length arithmetic and epoch-size calculations
# (`cast_possible_truncation` / `cast_sign_loss` /
# `cast_possible_wrap`), and to prevent direct `==` / `!=`
# comparisons on floats sneaking in via future code
# (`float_cmp`). The crypto crate has no `f32` / `f64` usage
# today, so the float deny is currently a no-op; it is kept for
# parity with the workspace policy and to fail-closed if float
# math is ever introduced.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
float_cmp = "deny"
