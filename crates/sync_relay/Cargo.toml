[package]
name = "sync_relay"
description = "Authenticated, untrusted store-and-forward relay for the Knowledge substrate's multi-device sync. The relay buckets opaque AEAD-sealed delta blobs by per-tenant topic and forwards them between a user's replicas; it never holds the master key, never decrypts, and never resolves CRDT state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sync_relay"
path = "src/main.rs"

[dependencies]
sync_engine = { path = "../sync_engine" }
thiserror = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
# `blocking` is additive on top of the workspace reqwest features
# (`json` + `rustls-tls`). The relay's `HttpRelayTransport` is a
# synchronous `SyncTransport` impl — it matches the synchronous
# `SyncEngine` API and is driven from replica threads, not from the
# server's tokio runtime — so it uses reqwest's blocking client.
reqwest = { workspace = true, features = ["blocking"] }

[lints]
workspace = true
