[package]
name = "evidence_store"
description = "SQLCipher-backed encrypted evidence store with content-hash deduplication, ring buffer, and lexicon-only importance classifier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Real ONNX Runtime + HuggingFace tokenizer backend for
# `embeddings::OrtOnnxRuntime`. With `load-dynamic` the build pulls in
# the `ort` crate without linking against `onnxruntime`; the native
# library is loaded at runtime (callers set `ORT_DYLIB_PATH` or the
# system search paths). Without this feature the crate builds with no
# ONNX dependency and only the stub / mock runtimes are available.
onnx-runtime = ["dep:ort", "dep:tokenizers"]
# Exposes test-only hooks for downstream integration crates (chiefly
# the `ffi` crate's unit + integration tests) to drive otherwise
# inaccessible code paths. Each hook is documented in detail in the
# crate's top-level doc comment (`src/lib.rs` `# Test-only types`
# section); the summary here is just a catalogue:
#   * `EvidenceStore::search_fts_with_weighted_ranks_for_tests`
#     — exposes the cross-lane merged BM25 ranks (after lane-weight
#     application) so the lane-weight precision hierarchy can be
#     asserted from outside the crate.
#   * `EvidenceStore::inject_with_transaction_failure_for_tests` /
#     `take_injected_with_transaction_failure` — lets tests force
#     `EvidenceStore::with_transaction` to fail on its next call so
#     callers (e.g. `apply_dispatch_outcome`'s commit path) can be
#     exercised against a synthetic disk-write failure without a
#     real SQLCipher I/O error.
# Gated `cfg(any(test, feature = "test-support"))` so production
# builds never compile the hooks nor pay the runtime cost of
# checking the injection slot on every `with_transaction` call.
test-support = []

[dependencies]
crypto = { path = "../crypto" }
inference_router = { path = "../inference_router" }

thiserror = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
# Pure-Rust trigram-based language detector used by the pre-
# embedding routing hook (`embedding_routing.rs`) to short-circuit
# ONNX invocations on text with no linguistic content (pure
# punctuation / emoji / digits / whitespace). The substrate already
# pulls `whatlang` in via `observation_engine` for per-sentence
# detection; making it a direct dep here lets the embedding lane
# reuse the same detector primitive without an upstream-direction
# crate dependency on `observation_engine`.
whatlang = { workspace = true }

# Platform-specific libc for SSD TRIM/discard ioctls
# (F_PUNCHHOLE on macOS, FITRIM on Linux). Guarded behind
# cfg(unix) so non-unix builds don't pull in the C binding.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Optional ONNX Runtime backend (enabled via `onnx-runtime` feature).
# Pinned to `=2.0.0-rc.10`: rc.9 fails to compile on stable Rust and
# rc.12's `vitis` execution provider references a field that does not
# exist on the bundled `OrtApi` struct, so the build breaks under
# `cargo build --all-features`.
#
# The MSRV co-gate is now cleared: `rc.11` and `rc.12` both declare
# `rust-version = "1.88"`, which the workspace MSRV floor of `1.88`
# (enforced by the `MSRV (1.88.0)` CI job) now satisfies. The pin
# therefore rests solely on the upstream `vitis` build break above —
# once a fixed `rc.13` ships, `ort` can move past `rc.10` with no
# further MSRV work.
#
# `rc.10` (MSRV `1.81`) is the latest version that fits the
# workspace MSRV gate. See `docs/security/dependency-policy.md` for the
# MSRV-gated pin policy and future-bump checklist.
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["load-dynamic", "ndarray"] }
# `fancy-regex` is the pure-Rust regex backend; the default `onig`
# backend pulls in a C library (libonig) that isn't part of CI.
# On `0.23.1`, the latest published version of the `0.23.x` line;
# upstream declares no MSRV, fits the workspace `1.88` floor
# cleanly. See `docs/security/dependency-policy.md`.
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
permission_service = { path = "../permission_service" }
agent_contract = { path = "../agent_contract" }
memory_manager = { path = "../memory_manager" }
# Integration tests under `tests/` exercise the substrate end-to-end
# using `crypto::TestSigner` (an HMAC-SHA256 mock signer). Enable the
# `test-support` feature on `crypto` so the gated mock types are
# visible while compiling the test binaries.
crypto = { path = "../crypto", features = ["test-support"] }
# Self-referential dev-dep: enables the `test-support` feature when
# compiling integration tests under `tests/`. Cargo's `cfg(test)` flag
# is only set on the test binary, NOT on the library it links against,
# so without this the test-only hooks (e.g.
# `search_fts_with_weighted_ranks_for_tests`) would be invisible to the
# integration test binaries.
evidence_store = { path = ".", features = ["test-support"] }

# Criterion benchmark harness for the hot ingest / read / search /
# ring-buffer paths. `harness = false` lets criterion run its own
# main; the bench file lives at `benches/store_bench.rs`.
[[bench]]
name = "store_bench"
harness = false

[lints]
workspace = true
