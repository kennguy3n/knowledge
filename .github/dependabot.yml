# Dependabot configuration for the Knowledge workspace.
#
# Tracks two ecosystems:
#
# 1. `cargo` — every workspace member resolves its dependencies
#    through the root `Cargo.lock`, so a single root entry catches
#    bumps across all ~20 crates. Limited to 10 open PRs at a time
#    so a noisy week of upstream releases does not bury the review
#    queue.
#
# 2. `github-actions` — every workflow file under `.github/workflows/`
#    is scanned for `uses:` lines, so action bumps stay current
#    without manual chasing. Capped at 5 concurrent PRs.
#
# Both schedules are weekly to amortise the review cost; raising
# either to `daily` is a noise-vs-freshness decision the maintainers
# can make later. Security-update PRs are unaffected by the weekly
# cadence — Dependabot dispatches those as soon as the upstream
# advisory lands.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(cargo)"
    labels:
      - "dependencies"
      - "rust"
    # Held-back pins. Most entries below are deps whose latest
    # release has bumped its `rust-version` beyond the workspace's
    # `MSRV (1.88.0)` CI gate at
    # `.github/workflows/ci.yml::MSRV (1.88.0)`. The version range
    # at the gate boundary is filtered out here so the review
    # queue is not littered with PRs that cannot land; once the
    # workspace MSRV moves forward, the matching block(s) below
    # should be deleted in the same PR that bumps the gate. Patch
    # bumps and intermediate minor bumps that stay below the gated
    # version are still picked up because each block only filters
    # the gated range.
    ignore:
      # rusqlite >=0.37 (via libsqlite3-sys >=0.36) requires Rust
      # 1.94+ for the stable `cfg_select!` macro. See the comment
      # block immediately above the `rusqlite = ` line in the
      # workspace `Cargo.toml` for the full rationale. We still
      # allow patch bumps within the 0.36.x line and minor bumps
      # up to (but not including) 0.37 so the substrate-side
      # rusqlite surface can be migrated incrementally if a future
      # maint sweep targets an intermediate.
      - dependency-name: "rusqlite"
        versions: [">=0.37"]
      # aws-nitro-enclaves-nsm-api >=0.5 sets rust-version=1.92.
      # See the comment block immediately above the
      # `aws-nitro-enclaves-nsm-api = ` line in
      # `crates/synthesis_engine/Cargo.toml` for the full
      # rationale.
      - dependency-name: "aws-nitro-enclaves-nsm-api"
        versions: [">=0.5"]
      # criterion >=0.8 requires Rust 1.86, which the 1.88 floor now
      # satisfies — so this is NO LONGER an MSRV gate. It is held back
      # only to keep the criterion 0.7 -> 0.8 benchmark-API migration a
      # reviewable, dedicated PR rather than churn inside an unrelated
      # change. See the comment block above the `criterion = ` line in
      # the workspace `Cargo.toml`. Drop this entry in the PR that does
      # the 0.8 migration.
      - dependency-name: "criterion"
        versions: [">=0.8"]
      # ort >=2.0.0-rc.11 has two independent blockers:
      #   1. Upstream `onnxruntime` exposes a Xilinx Vitis AI
      #      execution-provider field that references an `OrtApi`
      #      member that does not exist in the bundled API surface,
      #      so `cargo build --all-features` fails to compile.
      #      Upstream has not yet published a fixed `rc.13`.
      #   2. `rc.11` / `rc.12` both set `rust-version = "1.88"`. The
      #      1.88 floor now satisfies this, so blocker (2) is cleared;
      #      blocker (1) above (the unfixed `vitis` compile failure)
      #      still keeps `ort` pinned at `rc.10`.
      # See the comment block immediately above the `ort = ` line in
      # `crates/evidence_store/Cargo.toml` for the full rationale.
      - dependency-name: "ort"
        versions: [">=2.0.0-rc.11"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
      - "github-actions"
