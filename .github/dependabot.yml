# Dependabot configuration for the Knowledge workspace.
#
# Tracks two ecosystems:
#
# 1. `cargo` — every workspace member resolves its dependencies
#    through the root `Cargo.lock`, so a single root entry catches
#    bumps across all ~20 crates. Limited to 10 open PRs at a time
#    so a noisy week of upstream releases does not bury the review
#    queue.
#
# 2. `github-actions` — every workflow file under `.github/workflows/`
#    is scanned for `uses:` lines, so action bumps stay current
#    without manual chasing. Capped at 5 concurrent PRs.
#
# Both schedules are weekly to amortise the review cost; raising
# either to `daily` is a noise-vs-freshness decision the maintainers
# can make later. Security-update PRs are unaffected by the weekly
# cadence — Dependabot dispatches those as soon as the upstream
# advisory lands.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(cargo)"
    labels:
      - "dependencies"
      - "rust"
    # MSRV-gated pins. Each entry below is a dep whose latest
    # release has bumped its `rust-version` beyond the workspace's
    # `MSRV (1.85.0)` CI gate at
    # `.github/workflows/ci.yml::MSRV (1.85.0)`. The version range
    # at the gate boundary is filtered out here so the review
    # queue is not littered with PRs that cannot land; once the
    # workspace MSRV moves forward, the matching block(s) below
    # should be deleted in the same PR that bumps the gate. Patch
    # bumps and intermediate minor bumps that stay below the gated
    # version are still picked up because each block only filters
    # the gated range.
    ignore:
      # rusqlite >=0.37 (via libsqlite3-sys >=0.36) requires Rust
      # 1.94+ for the stable `cfg_select!` macro. Cargo.toml line
      # 105-119 explains the pin in detail. We still allow patch
      # bumps within the 0.32.x line and minor bumps up to (but
      # not including) 0.37 so the substrate-side rusqlite
      # surface can be migrated incrementally if a future maint
      # sweep targets an intermediate.
      - dependency-name: "rusqlite"
        versions: [">=0.37"]
      # aws-nitro-enclaves-nsm-api >=0.5 sets rust-version=1.92.
      # crates/synthesis_engine/Cargo.toml line 56-65 explains
      # the pin in detail.
      - dependency-name: "aws-nitro-enclaves-nsm-api"
        versions: [">=0.5"]
      # criterion >=0.8 requires Rust 1.86. Cargo.toml line
      # 127-143 explains the pin in detail.
      - dependency-name: "criterion"
        versions: [">=0.8"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
      - "github-actions"
