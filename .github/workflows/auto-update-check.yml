# Scheduled dependency-update + advisory check.
#
# Runs weekly (and on demand) to surface three classes of dependency
# drift for the Rust workspace:
#
#   * `cargo update --dry-run --workspace` — what would move if the
#     lockfile were refreshed within the current SemVer ranges.
#   * `cargo outdated` — dependencies whose latest release is outside
#     the declared range (i.e. would need a manifest bump).
#   * `cargo audit` — known RUSTSEC advisories against the locked tree.
#
# The results are written to the job summary and an issue is opened (or
# an existing open one updated) so the drift is tracked without
# spamming a new issue every week. Nothing here mutates the repo or the
# lockfile — it is a read-only report. Dependabot (`.github/dependabot.yml`)
# still owns the actual update PRs; this workflow is the human-readable
# digest layered on top.

name: auto-update-check

on:
  schedule:
    # 07:00 UTC every Monday.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

# Least privilege: read the code, write issues (to open/update the
# digest issue). No `contents: write` — the workflow never pushes.
permissions:
  contents: read
  issues: write

concurrency:
  group: auto-update-check
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-report:
    name: Dependency update + advisory report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo bin + registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-auto-update-tools-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-auto-update-tools-

      - name: Install cargo-outdated and cargo-audit
        run: |
          set -euo pipefail
          command -v cargo-outdated >/dev/null 2>&1 || cargo install cargo-outdated --locked
          command -v cargo-audit    >/dev/null 2>&1 || cargo install cargo-audit --locked

      - name: Collect the report
        id: report
        run: |
          set -euo pipefail
          report="$(mktemp)"
          {
            echo "# Dependency update report — $(date -u +%Y-%m-%d)"
            echo
            echo "_Generated by \`.github/workflows/auto-update-check.yml\` on commit \`${GITHUB_SHA}\`._"
            echo

            echo "## \`cargo update --dry-run\` (in-range lockfile drift)"
            echo
            echo '```'
            cargo update --dry-run --workspace 2>&1 || echo "cargo update --dry-run failed (see logs)"
            echo '```'
            echo

            echo "## \`cargo outdated\` (out-of-range / manifest bumps)"
            echo
            echo '```'
            # `--exit-code 0` so an "outdated deps exist" result is not
            # treated as a step failure — this is a report, not a gate.
            cargo outdated --workspace --root-deps-only --exit-code 0 2>&1 \
              || echo "cargo outdated failed (see logs)"
            echo '```'
            echo

            echo "## \`cargo audit\` (RUSTSEC advisories)"
            echo
            echo '```'
            cargo audit 2>&1 || echo "cargo audit reported advisories or failed (see logs)"
            echo '```'
          } > "${report}"

          # Surface in the job summary for at-a-glance viewing.
          cat "${report}" >> "$GITHUB_STEP_SUMMARY"

          # Stash the body for the issue step (multiline output via a
          # heredoc-delimited GITHUB_OUTPUT value). The delimiter is
          # randomized per run so a line of cargo output can never
          # collide with it and truncate the value — GitHub's documented
          # recommendation for multiline outputs.
          delim="REPORT_EOF_$(openssl rand -hex 16)"
          {
            echo "body<<${delim}"
            cat "${report}"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const body = process.env.REPORT_BODY;
            const title = "Weekly dependency update report";
            const label = "dependencies";

            // Reuse a single open issue with this title so the weekly
            // run refreshes it instead of opening a new one each time.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const match = existing.find((i) => !i.pull_request && i.title === title);

            // The Issues API does not auto-create labels: `issues.create`
            // with a non-existent label 422s. Ensure the label exists
            // first (idempotent — a 422 here means it already does), so a
            // fresh repo without Dependabot's `dependencies` label still
            // gets its tracking issue.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "0366d6",
                description: "Dependency updates and advisories",
              });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Refreshed by run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              });
              core.info(`Updated existing issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Opened issue #${created.data.number}`);
            }
        env:
          REPORT_BODY: ${{ steps.report.outputs.body }}
