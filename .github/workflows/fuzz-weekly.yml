name: Weekly Fuzz

# Each fuzz target (crypto + evidence_store) runs for one hour every
# Monday at 03:00 UTC. This is the deep-soak counterpart to the
# 120-second PR-loop fuzz job in `ci.yml`. `workflow_dispatch` lets a
# maintainer trigger an ad-hoc run from the Actions tab without touching
# the cron schedule.

on:
  schedule:
    - cron: '0 3 * * 1'  # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }}, 1h)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: crates/crypto/fuzz
            target: fuzz_aead_roundtrip
          - dir: crates/crypto/fuzz
            target: fuzz_hkdf_derive
          - dir: crates/crypto/fuzz
            target: fuzz_sphincs_sign_verify
          - dir: crates/crypto/fuzz
            target: fuzz_hybrid_kem_roundtrip
          - dir: crates/crypto/fuzz
            target: fuzz_mldsa_sign_verify
          - dir: crates/crypto/fuzz
            target: fuzz_forgetting_destroy
          - dir: crates/evidence_store/fuzz
            target: fuzz_cjk_bigram_tokenizer
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ${{ matrix.dir }}/target
          key: ${{ runner.os }}-fuzz-weekly-${{ matrix.target }}-${{ hashFiles(format('{0}/Cargo.toml', matrix.dir), 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-weekly-${{ matrix.target }}-
            ${{ runner.os }}-fuzz-
      # See ci.yml: cargo-fuzz 0.13.1's bundled lockfile pins a `rustix`
      # version that no longer compiles on current nightly, so we drop
      # `--locked` and let cargo pick up newer semver-compatible deps.
      #
      # The cache above restores `~/.cargo/bin/` from a sibling fuzz
      # cache key (`${{ runner.os }}-fuzz-`) when the matrix-specific
      # key misses; that warm cache contains an existing `cargo-fuzz`
      # binary, so calling `cargo install` again without `--force`
      # fails with "binary already exists in destination". Skip the
      # install when the cache already provided the binary — matches
      # the same guard used in ci.yml's `fuzz` job.
      - name: Install cargo-fuzz (skip when cache already provided it)
        run: |
          if command -v cargo-fuzz >/dev/null 2>&1; then
            echo "cargo-fuzz already on PATH at $(command -v cargo-fuzz); skipping install."
            cargo fuzz --version
          else
            cargo install cargo-fuzz
          fi
      - name: ${{ matrix.target }} (1h)
        working-directory: ${{ matrix.dir }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=3600
      - name: Upload corpus + artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            ${{ matrix.dir }}/corpus/${{ matrix.target }}/
            ${{ matrix.dir }}/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
