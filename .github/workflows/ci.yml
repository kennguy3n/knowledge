name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all --all-features

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # `RUSTSEC-2025-0144` is a timing side-channel in `ml-dsa 0.0.4`
      # (the pre-1.0 RustCrypto crate the Phase 7 ML-DSA-65 backend
      # currently pins). The fix lands in `ml-dsa >= 0.1.0-rc.3`,
      # which is a substantial API bump that has to be sequenced with
      # the wider provenance overhaul. The acknowledged debt is
      # tracked in `docs/internal/PROGRESS.md` (Phase 7) and
      # `docs/internal/MODULE_STATUS.md` ("Known security debt"). The ignore
      # is recorded explicitly on the command line — not in a config
      # file that cargo-audit 0.22 silently does not read from the
      # repo root — so it shows up in CI logs every run.
      - name: Security audit
        run: cargo audit --ignore RUSTSEC-2025-0144
