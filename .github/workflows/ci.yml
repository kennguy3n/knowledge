name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege: every job in this workflow only needs
# read access to the repo contents. The `fuzz` job's
# `actions/upload-artifact@v4` step uploads to the per-run actions
# scope, which is granted automatically and does not require an
# additional permission grant.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-default:
    name: clippy (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-default-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-default-
      - run: cargo clippy --all-targets -- -D warnings

  clippy-all:
    name: clippy (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-all-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-all-
      - run: cargo clippy --all-targets --all-features -- -D warnings

  build-default:
    name: build (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-default-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-default-
      - run: cargo build --all-targets

  build-release:
    name: build (release, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-release-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-release-
      - run: cargo build --release --workspace --exclude demo

  test-default:
    name: test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-default-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-default-
      - run: cargo test --all

  test-all-features:
    name: test (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-all-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-all-
      - run: cargo test --all --all-features

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-
      # `napi_addon` deliberately tracks the napi-rs 3.x MSRV (1.88+)
      # rather than the workspace floor — see the rust-version comment
      # in crates/napi/Cargo.toml. Excluding it here keeps the MSRV
      # signal meaningful for the rest of the workspace while letting
      # the napi crate use the modern napi-rs release.
      - run: cargo check --workspace --all-targets --exclude napi_addon

  cross-ios:
    name: cross-check (aarch64-apple-ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-ios-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cross-ios-
      - run: cargo check --workspace --target aarch64-apple-ios

  cross-android:
    name: cross-check (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-android-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cross-android-
      - name: Configure NDK toolchain
        run: |
          # Find the installed NDK (the runner pre-installs one).
          NDK_HOME="${ANDROID_NDK_HOME:-$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | sort -V | tail -1)}"
          NDK_TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CC_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          # openssl-sys build script also looks for the target-prefixed
          # ranlib in $PATH. Symlink it so the Makefile install_dev step
          # finds aarch64-linux-android-ranlib.
          sudo ln -sf "${NDK_TOOLCHAIN}/bin/llvm-ranlib" /usr/local/bin/aarch64-linux-android-ranlib
      - run: cargo check --workspace --target aarch64-linux-android

  audit:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  fuzz:
    name: cargo-fuzz (crypto, short)
    runs-on: ubuntu-latest
    # libFuzzer-via-cargo-fuzz only builds on nightly; the substrate
    # itself stays on stable, so this job is the only place the
    # nightly toolchain is used.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/crypto/fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('crates/crypto/fuzz/Cargo.toml', 'crates/crypto/Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fuzz-
      # `cargo install cargo-fuzz` without `--locked` so the install
      # picks up newer semver-compatible deps (in particular `rustix`,
      # which the bundled 0.13.1 lock pins to a version that no longer
      # compiles on current nightly). `cargo-fuzz` itself stays at the
      # latest published version.
      #
      # Skip the install when a prior run's cache has already
      # restored a `cargo-fuzz` binary into `~/.cargo/bin/` (via the
      # `restore-keys` fallback above). Otherwise `cargo install`
      # exits non-zero with "binary `cargo-fuzz` already exists in
      # destination" because it refuses to overwrite without
      # `--force` — a problem any PR that bumps `Cargo.lock` hits
      # on every run after the first cold-cache build.
      - name: Install cargo-fuzz (skip when cache already provided it)
        run: |
          if command -v cargo-fuzz >/dev/null 2>&1; then
            echo "cargo-fuzz already on PATH at $(command -v cargo-fuzz); skipping install."
            cargo fuzz --version
          else
            cargo install cargo-fuzz
          fi
      # The fuzz workspace lives at crates/crypto/fuzz (excluded from
      # the parent workspace) so we run from there. 120 s per target
      # is the ceiling for fast PR-loop feedback; the weekly job
      # (.github/workflows/fuzz-weekly.yml) runs each target for an
      # hour.
      - name: fuzz_aead_roundtrip (120s)
        working-directory: crates/crypto/fuzz
        run: cargo +nightly fuzz run fuzz_aead_roundtrip -- -max_total_time=120
      - name: fuzz_hkdf_derive (120s)
        working-directory: crates/crypto/fuzz
        run: cargo +nightly fuzz run fuzz_hkdf_derive -- -max_total_time=120
      - name: fuzz_sphincs_sign_verify (120s)
        working-directory: crates/crypto/fuzz
        run: cargo +nightly fuzz run fuzz_sphincs_sign_verify -- -max_total_time=120
      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-fuzz-artifacts
          path: crates/crypto/fuzz/artifacts/
          if-no-files-found: ignore

  napi-build:
    name: napi-build (${{ matrix.target }})
    needs: build-default
    # The N-API addon lives in `crates/napi/` and produces a
    # platform-specific `.node` artefact via `napi build`. We build
    # natively on each platform that the Electron host targets so
    # Node can actually `require()` the produced binary as part of
    # the smoke test. Cross-compile-only verification (without
    # exercising the binary in a Node host) would miss link-time
    # issues like the macOS `dynamic_lookup` directive emitted by
    # `napi_build::setup()`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-napi-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'crates/napi/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-napi-${{ matrix.target }}-
      # `cargo test -p napi_addon` proves the JSON-envelope error
      # contract on the rlib build before we go to the trouble of
      # producing the cdylib artefact. Running it as a separate step
      # makes the failure mode clearer: a red `cargo test` step
      # means the Rust-side envelope is wrong; a red `node --test`
      # step means the JS-side surface drifted.
      - name: cargo test -p napi_addon --lib
        run: cargo test -p napi_addon --lib --target ${{ matrix.target }}
      - name: npm install (crates/napi)
        working-directory: crates/napi
        run: npm install --no-fund --no-audit
      # `napi build --platform --release` produces three files in
      # `crates/napi/`:
      #
      # * `knowledge.<target>.node` — the platform-suffixed cdylib
      #   the Electron host `require()`s through the `index.js`
      #   loader.
      # * `index.js` — auto-generated loader that picks the right
      #   `.node` for the current `process.platform` /
      #   `process.arch`.
      # * `index.d.ts` — auto-generated TypeScript types.
      #
      # We compare the regenerated `index.js` / `index.d.ts` against
      # the tracked-in-git copies and fail the job if they drift, so
      # forgotten regenerations after a `crates/napi/src/bindings.rs`
      # edit get caught at PR time rather than after a release ships
      # stale types.
      - name: napi build (release)
        working-directory: crates/napi
        run: npx napi build --platform --release --target ${{ matrix.target }} --js index.js --dts index.d.ts
      - name: Verify generated loader / dts match tracked copies
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/napi
        run: |
          git diff --exit-code -- index.js index.d.ts || (
            echo '::error::crates/napi/index.js or index.d.ts is out of date — re-run `npx napi build --platform --release --js index.js --dts index.d.ts` from crates/napi/ and commit the result.'
            exit 1
          )
      - name: node --test (smoke tests)
        working-directory: crates/napi
        run: node --test 'test/*.test.mjs'
      - name: Upload .node artefact
        uses: actions/upload-artifact@v4
        with:
          name: napi-addon-${{ matrix.target }}
          path: crates/napi/knowledge.*.node
          if-no-files-found: error
          retention-days: 14
