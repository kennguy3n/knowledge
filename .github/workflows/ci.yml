name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege: every job in this workflow only needs
# read access to the repo contents. The `fuzz` job's
# `actions/upload-artifact@v7` step uploads to the per-run actions
# scope, which is granted automatically and does not require an
# additional permission grant.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-default:
    name: clippy (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-default-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-default-
      - run: cargo clippy --all-targets -- -D warnings

  unsafe-code-guard:
    name: unsafe-code allowlist
    runs-on: ubuntu-latest
    # Workspace-wide `unsafe_code` is set to `deny` (not `forbid`) in
    # the root `Cargo.toml` so that the napi-derive proc-macro
    # expansion in `crates/napi/src/bindings.rs` can opt back in via
    # a single `#![allow(unsafe_code)]`. This job pins the set of
    # crates that are permitted to use that escape hatch: if a new
    # `allow(unsafe_code)` (inner or outer attribute) appears
    # anywhere outside the allowlisted paths below, the job fails and
    # forces the author to justify the relaxation in review instead
    # of slipping it past the workspace-level guarantee.
    #
    # Allowlisted paths (see `ALLOWED_PATHS_RE` in the scan step):
    #   * `crates/napi/`                          — napi-derive
    #     proc-macro expansion in `crates/napi/src/bindings.rs`.
    #   * `crates/inference_router/src/config.rs`  — direct libc /
    #     Win32 syscalls (`sysconf`, `sysctlbyname`,
    #     `GlobalMemoryStatusEx`) for cgroup-aware RAM detection in
    #     `detect_total_ram_bytes`. No subprocess is spawned and each
    #     call site carries a `// SAFETY:` proof; the `unsafe` is
    #     unavoidable FFI, so the file is granted a narrow exception
    #     rather than relaxing the workspace floor.
    steps:
      - uses: actions/checkout@v6
      - name: Install ripgrep
        # The `*.rs` scan below uses `rg --multiline` to catch attribute
        # forms broken across newlines. `rg` is listed in the
        # `ubuntu-24.04` runner image manifest, but a stale runner /
        # minimal base image can occasionally omit it from `$PATH` — and
        # the previous failure mode was silent (a missing `rg` returned
        # nothing, `|| true` swallowed the error, the guard passed by
        # accident).
        #
        # We therefore (1) probe `rg` first, (2) install via apt if it's
        # missing, and (3) `rg --version` as a hard assertion so any
        # future image regression fails this step loudly instead of
        # silently disabling the security scan.
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            echo 'rg not found in PATH; installing ripgrep via apt.'
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
          rg --version
      - name: Find unsafe_code allows outside the allowlist
        run: |
          # Allowlist of paths permitted to relax `unsafe_code`, as a
          # single `grep -E` alternation. Edit this list (and the doc
          # above) when a new path is consciously granted an exception.
          #
          # Each alternative is an anchored regex fragment, NOT a bare
          # string — choose the anchoring deliberately:
          #   * a trailing-slash, unanchored-end fragment matches a
          #     whole subtree (directory prefix), e.g. `^crates/napi/`;
          #   * a `\.rs$`-anchored fragment matches one exact file,
          #     e.g. `crates/inference_router/src/config\.rs$`.
          # Prefer the narrowest form that covers the real exception
          # (a single file over a whole crate) so the guard keeps
          # firing on every other source.
          #
          # Current entries:
          #   * `^crates/napi/` (subtree) — napi-derive proc-macro
          #     expansion (`crates/napi/src/bindings.rs`).
          #   * `crates/inference_router/src/config\.rs$` (one file) —
          #     syscall FFI for cgroup-aware RAM detection
          #     (`detect_total_ram_bytes`): libc `sysconf` /
          #     `sysctlbyname` + Win32 `GlobalMemoryStatusEx`, each
          #     guarded by a `// SAFETY:` proof, no subprocess. Scoped
          #     to the single file so any other `inference_router`
          #     source still trips the guard.
          ALLOWED_PATHS_RE='^(crates/napi/|crates/inference_router/src/config\.rs$)'

          # Catch every attribute form that relaxes `unsafe_code`,
          # including ones wrapped in `cfg_attr` AND ones broken
          # across multiple lines by rustfmt or by a hand author:
          #   #[allow(unsafe_code)]
          #   #![allow(unsafe_code)]
          #   #[cfg_attr(feature = "x", allow(unsafe_code))]
          #   #![cfg_attr(any(...), allow(unsafe_code))]
          #   #[allow(
          #       unsafe_code
          #   )]
          #   #[allow(dead_code, unsafe_code, unused_imports)]
          # The pattern requires an attribute opener (`#[` or `#![`),
          # any prefix that stays inside the outer attribute brackets
          # (`[^]]*`), an `allow(` token, and a word-boundaried
          # `unsafe_code` somewhere inside the `allow(...)` argument
          # list (`[^)]*\bunsafe_code\b[^)]*`). The pattern uses
          # `[^]]` / `[^)]` instead of `.` so it spans newlines
          # without needing `--multiline-dotall`; `rg --multiline -U`
          # is the multi-line equivalent of `grep -E`.
          #
          # The scan is intentionally raw-text and operates on the
          # whole file — it does NOT skip `//` line comments, `///`
          # doc comments, or `/* ... */` block comments. A line like
          #   // example: #[allow(unsafe_code)]
          # WILL trigger this guard. That's a conservative
          # false-positive direction (the guard fires when it
          # arguably shouldn't, instead of letting a real attribute
          # through), so anyone documenting the lint in a comment
          # should escape the attribute opener (e.g. write
          # `#&#91;allow(...)]` or break the literal across lines
          # with a markdown backtick fence) rather than rely on the
          # scanner to ignore comments. Future maintainers: this is
          # safe-by-design, not a bug.
          PATTERN='#!?\[[^]]*\ballow\([^)]*\bunsafe_code\b[^)]*\)'

          # `rg -nU --multiline` so we catch attribute forms that
          # break across newlines (rustfmt collapses simple cases
          # to a single line, but a `#[rustfmt::skip]`-bracketed
          # attribute, a wide `allow(...)` list that wrapped onto
          # multiple lines, or a hand-edited file can still hide a
          # match from a line-oriented grep). `git ls-files` so we
          # only look at tracked sources (no vendored deps, no
          # build artefacts).
          #
          # Scope: tracked `*.rs` files only. The PATTERN above is
          # Rust attribute syntax (`#[...]` / `#![...]`) and would
          # never match valid YAML / TOML / Markdown — so extending
          # the glob to `*.yml` / `*.toml` would be noise. The
          # workflow file itself (this very job) and the workspace
          # `Cargo.toml` lint table are protected by branch
          # protection + code review, not by this scanner; a
          # reviewer editing `ALLOWED_PATHS_RE` or removing this job
          # has to be caught by a human reviewing the diff. That is
          # intentional — this guard is a defense-in-depth check on
          # the actual source tree, not a self-protecting CI
          # lockdown.
          #
          # `rg` availability is enforced by the preceding
          # `Install ripgrep` step — it either confirmed `rg` is on
          # PATH or installed ripgrep via apt and printed the
          # version. If `rg` is somehow still missing here the script
          # will fail with a `command not found` (exit 127) instead
          # of silently passing.
          mapfile -t scan_files < <(git ls-files -- '*.rs' \
            | grep -vE "${ALLOWED_PATHS_RE}" || true)
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo 'No tracked *.rs files outside the unsafe-code allowlist; skipping scan.'
            matches=''
          else
            # `rg` exits 0 on match found, 1 on no match, 2+ on error.
            # Capture stdout AND the exit code so a real error (missing
            # binary, bad regex, IO failure) fails the guard loudly
            # instead of being swallowed by a blanket `|| true`. The
            # previous form (`rg ... || true`) is what silently disabled
            # the scan when the runner image shipped without `rg`.
            matches="$(rg --multiline -nU -e "${PATTERN}" -- "${scan_files[@]}")" \
              || rg_status=$?
            rg_status="${rg_status:-0}"
            if [ "${rg_status}" -ge 2 ]; then
              echo "::error::rg exited with status ${rg_status} (>= 2 indicates a real error, not 'no matches')."
              exit "${rg_status}"
            fi
          fi

          if [ -n "${matches}" ]; then
            echo '::error::A new `allow(unsafe_code)` (including `cfg_attr`-gated forms) was introduced outside the unsafe-code allowlist:'
            echo "${matches}"
            echo
            echo 'The workspace `Cargo.toml` sets `unsafe_code = "deny"` so that the'
            echo 'napi crate can opt back in for napi-derive proc-macro expansion.'
            echo 'Any other relaxation — including conditional `#[cfg_attr(..., allow(unsafe_code))]`'
            echo '— needs explicit review. Please either remove the `allow`, or update the allowlist'
            echo 'in `.github/workflows/ci.yml` with a justification comment.'
            exit 1
          fi

          echo 'No stray allow(unsafe_code) attributes found outside the unsafe-code allowlist.'
      - name: Pin Cargo.toml unsafe_code policy
        # Companion check to the *.rs scan above. The Rust attribute
        # scan only catches someone *adding* `#[allow(unsafe_code)]`
        # to a source file — it cannot catch someone *removing* the
        # `unsafe_code = "forbid"` lint declaration from a
        # security-critical crate's `Cargo.toml`, or *downgrading*
        # the workspace-level `unsafe_code = "deny"` to `"allow"`.
        # Both are silent weakenings of the same security posture.
        #
        # This step pins the EXPECTED `unsafe_code` declarations in
        # Cargo.toml files:
        #
        #   * Root `Cargo.toml`: must declare `unsafe_code = "deny"`
        #     (workspace floor; gated relaxation point for napi).
        #   * `crates/crypto/Cargo.toml`: must declare
        #     `unsafe_code = "forbid"` (PQC primitives, never relax).
        #
        # It also asserts that NO other tracked `Cargo.toml`
        # introduces an `unsafe_code = ...` declaration without
        # being added to `ALLOWED_TOML_PATHS` here, with a
        # justification comment. New FFI crates would extend the
        # allowlist; pure-Rust crates inherit the workspace `deny`
        # transparently via `[lints] workspace = true`.
        run: |
          # Map of files that are PERMITTED to set `unsafe_code` in
          # `[lints.rust]` and the exact level we expect. Each
          # expected entry is `path:level`; the step verifies the
          # level is present in the file (catches removal /
          # downgrade) AND that no OTHER tracked `Cargo.toml` sets
          # `unsafe_code` at all (catches stealth additions).
          EXPECTED=(
            'Cargo.toml:deny'
            'crates/crypto/Cargo.toml:forbid'
          )

          fail=0

          # 1. Verify each expected file still has the expected level.
          for entry in "${EXPECTED[@]}"; do
            path="${entry%:*}"
            level="${entry##*:}"
            if [ ! -f "${path}" ]; then
              echo "::error::Expected pinned Cargo.toml ${path} no longer exists."
              fail=1
              continue
            fi
            if ! grep -qE "^\s*unsafe_code\s*=\s*\"${level}\"\s*$" "${path}"; then
              echo "::error::${path} must declare unsafe_code = \"${level}\" — pinned by the unsafe-code-guard CI job."
              echo '          If you genuinely intend to weaken this, update both this CI step and the corresponding crate review notes.'
              fail=1
            fi
          done

          # 2. Build the allowlist regex from EXPECTED so the scan
          # below skips known-good files without hardcoding paths
          # twice.
          allow_re=''
          for entry in "${EXPECTED[@]}"; do
            path="${entry%:*}"
            esc="$(printf '%s' "${path}" | sed -e 's/[\/.^$*+?()[\]{}|]/\\&/g')"
            if [ -z "${allow_re}" ]; then
              allow_re="^(${esc}"
            else
              allow_re="${allow_re}|${esc}"
            fi
          done
          allow_re="${allow_re})$"

          # 3. Look for stray `unsafe_code = ...` lines in any
          # tracked `Cargo.toml` outside the allowlist. Any hit is a
          # silent attempt to override the workspace policy at the
          # crate level — must be reviewed (and added to EXPECTED
          # above with a comment).
          mapfile -t toml_files < <(git ls-files -- '*Cargo.toml' \
            | grep -vE "${allow_re}" || true)
          if [ "${#toml_files[@]}" -gt 0 ]; then
            stray="$(grep -lE '^\s*unsafe_code\s*=' -- "${toml_files[@]}" || true)"
            if [ -n "${stray}" ]; then
              echo '::error::A Cargo.toml outside the unsafe-code-guard allowlist declares `unsafe_code = ...`:'
              echo "${stray}"
              echo
              echo 'Crates inherit the workspace `unsafe_code = "deny"` via `[lints] workspace = true`.'
              echo 'If a new crate genuinely needs to override the workspace policy (e.g. a new FFI crate'
              echo 'that needs `deny` instead of `forbid`, or a security-critical crate that needs to pin'
              echo '`forbid`), add the path to EXPECTED in this CI step with a justification comment.'
              exit 1
            fi
          fi

          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi

          echo 'Cargo.toml unsafe_code policy is intact.'

  clippy-all:
    name: clippy (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-all-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-all-
      - run: cargo clippy --all-targets --all-features -- -D warnings

  build-default:
    name: build (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-default-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-default-
      - run: cargo build --all-targets

  build-release:
    name: build (release, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-release-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-release-
      - run: cargo build --release --workspace --exclude demo

  test-default:
    name: test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-default-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-default-
      - run: cargo test --all

  test-all-features:
    name: test (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-all-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-all-
      - run: cargo test --all --all-features

  test-http-client-isolated:
    name: test (http-client feature, isolated)
    runs-on: ubuntu-latest
    # Exercise the `http-client` feature on the two
    # network-aware crates *without* the rest of `--all-features`.
    # Catches the class of bug where `connector_framework` /
    # `inference_router` compile only because some OTHER feature
    # (e.g. `tracing-subscriber`, `async-http-client`) is also
    # enabled — the all-features job would miss that. Running each
    # crate's `--features http-client` in isolation pins the
    # feature-flag boundary cleanly.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-http-client-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-http-client-
      - name: connector_framework — http-client only
        run: cargo test -p connector_framework --no-default-features --features http-client
      - name: inference_router — http-client only
        run: cargo test -p inference_router --no-default-features --features http-client

  connector_audit:
    name: connector audit & business-proof gate
    runs-on: ubuntu-latest
    # End-to-end quality gate that ties the connector unit suite, the
    # extraction-quality eval, the cross-lingual recall benchmark and
    # the SME business-proof demo into a single regression guard. The
    # cargo steps run first (cheap, fail fast); the dockerized demo and
    # its regression diff run last because they stand up the full
    # gateway stack.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-connector-audit-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-connector-audit-

      # Snapshot the pristine committed results BEFORE the demo run
      # overwrites them in the working tree — this is the regression
      # baseline used by the final guard step.
      - name: Snapshot committed demo-results baseline
        run: cp demos/sme-knowledge-demo/results/sme_demo_results.json /tmp/baseline_results.json

      # 1. All connector unit tests, every feature (MockHttpTransport
      #    sync/content-fetch/webhook coverage for every connector).
      - name: connector unit tests (all features)
        run: cargo test -p connectors --all-features

      # 2. Extraction-quality eval — the golden dataset asserts the
      #    per-type F1 floors documented in
      #    docs/technical/extraction-quality.md.
      - name: extraction quality eval (F1 floors)
        run: cargo test -p integration_tests --test observation_eval -- --nocapture

      # 3. Cross-lingual recall benchmark — asserts the hit-rate@{1,3}
      #    and recall@k floors across all 22 shipped lexicon languages.
      - name: cross-lingual recall benchmark (hit-rate floors)
        run: cargo test -p evidence_store --test cross_lingual_recall_benchmark -- --nocapture

      # 4. SME business-proof demo against the dockerized gateway. The
      #    stack is brought up from source; the demo ingests the
      #    multi-region dataset and asserts 30+ business properties.
      - name: Bring up dockerized gateway stack
        env:
          # docker compose interpolates every `${VAR:?…}` in the file
          # at parse time regardless of which service is targeted, so
          # all required passwords must be present even though only the
          # gateway and its transitive deps (postgres, nats, substrate)
          # are started. These are throwaway CI-local credentials.
          POSTGRES_PASSWORD: ci-postgres-pw
          MINIO_ROOT_PASSWORD: ci-minio-pw
          GF_ADMIN_PASSWORD: ci-grafana-pw
          KNOWLEDGE_API_KEY: ci-demo-key
          # knowledge-substrate refuses to boot without a master key
          # (substrate_server::config::decode_master_key expects 32
          # bytes / 64 hex chars). Without this the substrate container
          # crash-loops and the gateway never becomes healthy. Throwaway
          # CI-local key — NOT a real secret.
          KNOWLEDGE_MASTER_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build \
            knowledge-gateway
          echo "Waiting for gateway /health to report ok…"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "Gateway healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "Gateway did not become healthy in time; dumping logs." >&2
          docker compose -f deploy/docker-compose.yml logs --no-color >&2
          exit 1

      - name: Run SME business-proof demo (assert exit 0)
        env:
          KNOWLEDGE_GATEWAY_URL: http://localhost:8080
          KNOWLEDGE_API_KEY: ci-demo-key
        run: python3 demos/sme-knowledge-demo/run_demo.py

      # 5. Regression guard — every assertion that passed in the
      #    committed baseline must still pass in the fresh run.
      - name: SME demo regression guard (no previously-passing assertion regresses)
        run: |
          python3 demos/sme-knowledge-demo/check_regression.py \
            /tmp/baseline_results.json \
            demos/sme-knowledge-demo/results/sme_demo_results.json

      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v --remove-orphans

      # 6. B2C / B2B end-to-end lifecycle integration tests — exercise
      #    the consumer and enterprise ingest → extract → retrieve →
      #    forget paths through the real substrate crates. These are
      #    pure `cargo test` steps with no Docker dependency, so they run
      #    even when an earlier step (e.g. the dockerized demo) failed —
      #    `!cancelled()` keeps their pass/fail signal from being masked
      #    by an unrelated failure while leaving job ordering untouched.
      - name: B2C / B2B lifecycle integration tests
        if: ${{ !cancelled() }}
        run: cargo test -p integration_tests --test b2c_lifecycle --test b2b_lifecycle

      # 7. Dual-run extraction-quality comparison — runs the eval once
      #    here (no CANDIDATE_CMD is set, so it reuses the baseline run;
      #    a distinct CANDIDATE_CMD would trigger a real second run) and
      #    fails if the candidate run regresses any per-type F1. Also
      #    guarded with `!cancelled()` so the regression gate still runs
      #    after an unrelated earlier failure.
      - name: Extraction-quality dual-run comparison
        if: ${{ !cancelled() }}
        run: scripts/compare_extraction_quality.sh

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-
      # `napi_addon` deliberately tracks the napi-rs 3.x MSRV (1.88+)
      # rather than the workspace floor — see the rust-version comment
      # in crates/napi/Cargo.toml. Excluding it here keeps the MSRV
      # signal meaningful for the rest of the workspace while letting
      # the napi crate use the modern napi-rs release.
      - run: cargo check --workspace --all-targets --exclude napi_addon
      # The check above does not enable `http-client`, so it never pulls
      # reqwest's transitive `url -> idna -> icu_*` chain. The production
      # binaries (`deploy/Dockerfile.substrate` + the `release.yml` binaries
      # job) DO build with `--features http-client` on the `rust:1.85` image,
      # so gate that path here with `--locked` too. This fails CI if a
      # committed lock bumps icu/idna to an MSRV-incompatible version
      # (e.g. icu 2.2.0 -> rustc 1.86) instead of only breaking at release.
      - run: cargo check --locked -p substrate_server --features http-client

  cross-ios:
    name: cross-check (aarch64-apple-ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-ios-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cross-ios-
      - run: cargo check --workspace --target aarch64-apple-ios

  cross-android:
    name: cross-check (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-android-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cross-android-
      - name: Configure NDK toolchain
        run: |
          # Find the installed NDK (the runner pre-installs one).
          NDK_HOME="${ANDROID_NDK_HOME:-$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | sort -V | tail -1)}"
          NDK_TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CC_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          # openssl-sys build script also looks for the target-prefixed
          # ranlib in $PATH. Symlink it so the Makefile install_dev step
          # finds aarch64-linux-android-ranlib.
          sudo ln -sf "${NDK_TOOLCHAIN}/bin/llvm-ranlib" /usr/local/bin/aarch64-linux-android-ranlib
      - run: cargo check --workspace --target aarch64-linux-android

  # Real iOS build: produces the `.xcframework` + Swift package
  # consumed by `uneycom/kchat-next-ios`. Mirrors the
  # `cross-ios` job pattern (macOS runner, aarch64-apple-ios
  # target) but goes further: invokes `crates/ffi/scripts/build_ios.sh`,
  # which calls `cargo swift package` to produce the same artefacts the
  # release pipeline (and the platform host repo) consume.
  # Uploaded as a workflow artefact so reviewers can download and
  # smoke-test the generated framework without running the build
  # locally.
  ios-build:
    name: ios-build (.xcframework + Swift package)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `cargo swift package` walks all the iOS slices it
          # knows about; pre-installing the targets here saves the
          # script ~30s of `rustup target add` time on every run.
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-ios-build-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ios-build-
      - name: Install cargo-swift
        # `--locked` pins the transitive dep set so the install
        # is reproducible. Skipped when the binary is already in
        # the cargo cache from the cache-restore step.
        run: |
          if ! command -v cargo-swift >/dev/null 2>&1; then
            cargo install cargo-swift --locked
          fi
      - name: Build iOS Swift package + XCFramework
        run: crates/ffi/scripts/build_ios.sh
      - name: Upload iOS artefacts
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-ios
          path: crates/ffi/ios
          if-no-files-found: error

  # Real Android build: cross-compiles the JNI `.so` libraries for
  # the two Android ABIs the host modules ship (arm64-v8a +
  # x86_64) and generates the Kotlin bindings. Mirrors the
  # cross-android `cargo check` job but invokes
  # `crates/ffi/scripts/build_android.sh` end-to-end, producing
  # the same `android/uniffi/knowledge/` layout
  # `uneycom/kchat-next-android` consumes. Uploaded as a workflow
  # artefact for downstream consumption + reviewer smoke tests.
  android-build:
    name: android-build (Kotlin bindings + JNI .so)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-android-build-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-android-build-
      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
      - name: Configure NDK toolchain
        # Same toolchain wiring as the `cross-android` check job
        # above, extended to BOTH ABIs the host modules ship
        # (`aarch64-linux-android` + `x86_64-linux-android`). The
        # Android NDK is pre-installed on the `ubuntu-latest` runner;
        # we expose the per-target linker / archiver paths via
        # $GITHUB_ENV so `cargo ndk` and any `cc`-crate build script
        # (e.g. `openssl-sys`) pick them up. API level 24
        # (Android 7.0+) matches the min-sdk surface the host app
        # targets.
        #
        # The NDK binary prefix for each Cargo triple has to be
        # matched explicitly (`x86_64` keeps the underscore — a
        # naïve `${var//_/-}` substitution would mangle it to
        # `x86-64-linux-android` and point at a non-existent
        # binary). The `cc`-crate env-var names use the
        # underscored Cargo triple verbatim; only the binary path
        # uses the NDK's hyphenated-but-keep-`x86_64` convention.
        #
        # `openssl-sys`'s build script ALSO probes `$PATH` for a
        # target-prefixed ranlib (e.g. `aarch64-linux-android-ranlib`).
        # Symlinking both targets into `/usr/local/bin` matches the
        # existing `cross-android` job pattern and is defence in
        # depth — most modern `cc-rs` versions respect the env
        # vars, but the symlink is what kept the legacy job green
        # before the env-var wiring was added.
        run: |
          NDK_HOME="${ANDROID_NDK_HOME:-$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | sort -V | tail -1)}"
          NDK_TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          configure_triple() {
            local cargo_triple="$1"     # e.g. aarch64_linux_android (Cargo env-var form, underscored)
            local ndk_prefix="$2"       # e.g. aarch64-linux-android (NDK binary prefix; preserves x86_64 underscore)
            local cargo_target_upper
            cargo_target_upper=$(echo "$cargo_triple" | tr '[:lower:]' '[:upper:]')
            echo "CC_${cargo_triple}=${NDK_TOOLCHAIN}/bin/${ndk_prefix}24-clang" >> "$GITHUB_ENV"
            echo "AR_${cargo_triple}=${NDK_TOOLCHAIN}/bin/llvm-ar" >> "$GITHUB_ENV"
            echo "RANLIB_${cargo_triple}=${NDK_TOOLCHAIN}/bin/llvm-ranlib" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_${cargo_target_upper}_LINKER=${NDK_TOOLCHAIN}/bin/${ndk_prefix}24-clang" >> "$GITHUB_ENV"
            sudo ln -sf "${NDK_TOOLCHAIN}/bin/llvm-ranlib" "/usr/local/bin/${ndk_prefix}-ranlib"
          }
          configure_triple "aarch64_linux_android" "aarch64-linux-android"
          configure_triple "x86_64_linux_android"  "x86_64-linux-android"
      - name: Build Android JNI .so + Kotlin bindings
        run: crates/ffi/scripts/build_android.sh
      - name: Upload Android artefacts
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-android
          path: crates/ffi/android
          if-no-files-found: error

  audit:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    # Generate a CycloneDX Software Bill of Materials for the whole
    # workspace and publish it as a build artifact, so every commit
    # has an auditable, machine-readable dependency manifest. See
    # docs/security/supply-chain.md for how the SBOM fits the supply-chain
    # policy alongside the `audit` and `deny` gates above.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-sbom-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sbom-
      # Skip the install when a cache hit already restored the binary
      # into ~/.cargo/bin (cargo install errors rather than overwrite).
      - name: Install cargo-cyclonedx (skip when cache provided it)
        run: |
          if command -v cargo-cyclonedx >/dev/null 2>&1; then
            echo "cargo-cyclonedx already on PATH at $(command -v cargo-cyclonedx); skipping install."
          else
            cargo install cargo-cyclonedx --locked
          fi
      # Emit one <crate>.cdx.json per workspace member alongside each
      # crate's Cargo.toml, then collect them into a single directory
      # for upload.
      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --all --format json
          mkdir -p sbom
          find crates -name '*.cdx.json' -exec cp --parents {} sbom/ \;
          ls -R sbom
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-sbom-cyclonedx
          path: sbom/**/*.cdx.json
          if-no-files-found: error

  fuzz:
    name: cargo-fuzz (crypto, short)
    runs-on: ubuntu-latest
    # libFuzzer-via-cargo-fuzz only builds on nightly; the substrate
    # itself stays on stable, so this job is the only place the
    # nightly toolchain is used.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/crypto/fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('crates/crypto/fuzz/Cargo.toml', 'crates/crypto/Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fuzz-
      # `cargo install cargo-fuzz` without `--locked` so the install
      # picks up newer semver-compatible deps (in particular `rustix`,
      # which the bundled 0.13.1 lock pins to a version that no longer
      # compiles on current nightly). `cargo-fuzz` itself stays at the
      # latest published version.
      #
      # Skip the install when a prior run's cache has already
      # restored a `cargo-fuzz` binary into `~/.cargo/bin/` (via the
      # `restore-keys` fallback above). Otherwise `cargo install`
      # exits non-zero with "binary `cargo-fuzz` already exists in
      # destination" because it refuses to overwrite without
      # `--force` — a problem any PR that bumps `Cargo.lock` hits
      # on every run after the first cold-cache build.
      - name: Install cargo-fuzz (skip when cache already provided it)
        run: |
          if command -v cargo-fuzz >/dev/null 2>&1; then
            echo "cargo-fuzz already on PATH at $(command -v cargo-fuzz); skipping install."
            cargo fuzz --version
          else
            cargo install cargo-fuzz
          fi
      # The fuzz workspace lives at crates/crypto/fuzz (excluded from
      # the parent workspace) so we run from there. 120 s per target
      # is the ceiling for fast PR-loop feedback; the weekly job
      # (.github/workflows/fuzz-weekly.yml) runs each target for an
      # hour.
      - name: fuzz_aead_roundtrip (120s)
        working-directory: crates/crypto/fuzz
        run: cargo +nightly fuzz run fuzz_aead_roundtrip -- -max_total_time=120
      - name: fuzz_hkdf_derive (120s)
        working-directory: crates/crypto/fuzz
        run: cargo +nightly fuzz run fuzz_hkdf_derive -- -max_total_time=120
      - name: fuzz_sphincs_sign_verify (120s)
        working-directory: crates/crypto/fuzz
        run: cargo +nightly fuzz run fuzz_sphincs_sign_verify -- -max_total_time=120
      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crypto-fuzz-artifacts
          path: crates/crypto/fuzz/artifacts/
          if-no-files-found: ignore

  napi-build-pr:
    name: napi-build (PR smoke, ubuntu-latest)
    needs: build-default
    # Lightweight PR-loop validation of the N-API addon. Runs on every
    # PR push *except* PRs labelled `ci:full` (those get the full
    # cross-platform matrix via the `napi-build` job below — the two
    # jobs are mutually exclusive so we never run both on the same
    # event).
    #
    # Linux-only. The Rust source, the `index.js`/`index.d.ts` loader
    # generation, the JSON-envelope error contract, and the JS smoke
    # tests are all platform-agnostic, so exercising them on a single
    # `ubuntu-latest` runner catches every napi-side regression we
    # could catch on macOS or Windows. The platform-specific surface
    # (macOS `-undefined dynamic_lookup`, Windows `.lib` import
    # libraries, ARM64 link order) is only meaningful for release
    # artefacts and is gated behind the `ci:full` label / push-to-main.
    #
    # Branch protection note: GitHub required-status-checks match
    # the *exact* check name — there is no prefix / glob matching.
    # The full job name `napi-build (PR smoke, ubuntu-latest)` is
    # therefore distinct from `napi-build (x86_64-unknown-linux-gnu)`
    # and the other matrix-leg names produced by the `napi-build`
    # job below.
    #
    # Recommended branch-protection wiring on `main`:
    #
    #   * REQUIRED for every PR:
    #       `napi-build (PR smoke, ubuntu-latest)`
    #     This job runs on every PR that is NOT labelled `ci:full`,
    #     so requiring it guarantees a Linux N-API smoke signal
    #     before merge without blocking on macOS / Windows runners.
    #
    #   * REQUIRED only on PRs labelled `ci:full` (via per-rule
    #     configuration or a separate ruleset):
    #       `napi-build (x86_64-unknown-linux-gnu)`
    #       `napi-build (aarch64-apple-darwin)`
    #       `napi-build (x86_64-apple-darwin)`
    #       `napi-build (x86_64-pc-windows-msvc)`
    #
    # The `ci:full`-gated full matrix is intentionally NOT required
    # on every PR — it exists so contributors can opt in to the
    # platform-specific link / runtime smoke before tagging a
    # release, and so the same matrix runs unconditionally on
    # pushes to `main`.
    if: |
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Share the cache key with the full-matrix `napi-build` job's
          # Linux leg so PR runs warm the cache that push-to-main
          # consumes, and vice versa.
          key: ${{ runner.os }}-napi-x86_64-unknown-linux-gnu-${{ hashFiles('Cargo.lock', 'crates/napi/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-napi-x86_64-unknown-linux-gnu-
      - name: cargo test -p napi_addon --lib
        run: cargo test -p napi_addon --lib --target x86_64-unknown-linux-gnu
      - name: npm install (crates/napi)
        working-directory: crates/napi
        run: npm install --no-fund --no-audit
      - name: napi build (release)
        working-directory: crates/napi
        run: npx napi build --platform --release --target x86_64-unknown-linux-gnu --js index.js --dts index.d.ts
      - name: Verify generated loader / dts match tracked copies
        working-directory: crates/napi
        run: |
          git diff --exit-code -- index.js index.d.ts || (
            echo '::error::crates/napi/index.js or index.d.ts is out of date — re-run `npx napi build --platform --release --js index.js --dts index.d.ts` from crates/napi/ and commit the result.'
            exit 1
          )
      - name: node --test (smoke tests)
        working-directory: crates/napi
        run: node --test 'test/*.test.mjs'

  napi-build:
    name: napi-build (${{ matrix.target }})
    needs: build-default
    # The N-API addon lives in `crates/napi/` and produces a
    # platform-specific `.node` artefact via `napi build`. We build
    # natively on each platform that the Electron host targets so
    # Node can actually `require()` the produced binary as part of
    # the smoke test. Cross-compile-only verification (without
    # exercising the binary in a Node host) would miss link-time
    # issues like the macOS `dynamic_lookup` directive emitted by
    # `napi_build::setup()`.
    #
    # PR iteration cost: the macos-13 (Intel) leg of this matrix has
    # historically queue-starved for 1–2 hours per run because the
    # public `macos-13` runner pool is small. Cross-platform validation
    # is only meaningful at merge time — in-progress PRs are validated
    # by the `napi-build-pr` smoke job (Linux-only) immediately below.
    # The full 4-platform matrix runs only when:
    #
    #   * `push`           — includes every push to `main` so release
    #                       artefacts always exist after merge.
    #   * `workflow_dispatch` — manual one-click full run from the
    #                       Actions UI.
    #   * PR labelled `ci:full` — explicit opt-in per the user
    #                       directive "don't have to run all checks
    #                       every PRs until explicitly requested".
    #                       Apply the label when you want
    #                       cross-platform validation before merge
    #                       (e.g. release candidates, big napi
    #                       refactors). Removing the label cancels
    #                       the in-flight run via the workflow
    #                       concurrency key.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-napi-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'crates/napi/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-napi-${{ matrix.target }}-
      # `cargo test -p napi_addon` proves the JSON-envelope error
      # contract on the rlib build before we go to the trouble of
      # producing the cdylib artefact. Running it as a separate step
      # makes the failure mode clearer: a red `cargo test` step
      # means the Rust-side envelope is wrong; a red `node --test`
      # step means the JS-side surface drifted.
      - name: cargo test -p napi_addon --lib
        run: cargo test -p napi_addon --lib --target ${{ matrix.target }}
      - name: npm install (crates/napi)
        working-directory: crates/napi
        run: npm install --no-fund --no-audit
      # `napi build --platform --release` produces three files in
      # `crates/napi/`:
      #
      # * `knowledge.<target>.node` — the platform-suffixed cdylib
      #   the Electron host `require()`s through the `index.js`
      #   loader.
      # * `index.js` — auto-generated loader that picks the right
      #   `.node` for the current `process.platform` /
      #   `process.arch`.
      # * `index.d.ts` — auto-generated TypeScript types.
      #
      # We compare the regenerated `index.js` / `index.d.ts` against
      # the tracked-in-git copies and fail the job if they drift, so
      # forgotten regenerations after a `crates/napi/src/bindings.rs`
      # edit get caught at PR time rather than after a release ships
      # stale types.
      - name: napi build (release)
        working-directory: crates/napi
        run: npx napi build --platform --release --target ${{ matrix.target }} --js index.js --dts index.d.ts
      - name: Verify generated loader / dts match tracked copies
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/napi
        run: |
          git diff --exit-code -- index.js index.d.ts || (
            echo '::error::crates/napi/index.js or index.d.ts is out of date — re-run `npx napi build --platform --release --js index.js --dts index.d.ts` from crates/napi/ and commit the result.'
            exit 1
          )
      - name: node --test (smoke tests)
        working-directory: crates/napi
        run: node --test 'test/*.test.mjs'
      - name: Upload .node artefact
        uses: actions/upload-artifact@v7
        with:
          name: napi-addon-${{ matrix.target }}
          path: crates/napi/knowledge.*.node
          if-no-files-found: error
          retention-days: 14

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --all
      - uses: actions/upload-artifact@v7
        with:
          name: knowledge-sbom-cyclonedx
          path: "**/*.cdx.json"
          if-no-files-found: error
