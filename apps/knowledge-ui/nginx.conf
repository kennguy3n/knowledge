# nginx config TEMPLATE for the Knowledge end-user UI.
#
# This file is installed as an nginx "template" (see Dockerfile): the
# official nginx entrypoint runs `envsubst` over it on container start,
# substituting ${GATEWAY_UPSTREAM} (and only GATEWAY_*-prefixed vars,
# via NGINX_ENVSUBST_FILTER) before nginx loads it. nginx's own runtime
# variables ($host, $uri, …) are left untouched.
#
# - Serves the Next.js static export (`output: 'export'`, trailingSlash)
#   on port 3002 with directory-style `index.html` files.
# - Reverse-proxies the gateway API surface (/api, /health, /metrics) to
#   ${GATEWAY_UPSTREAM} (default `knowledge-gateway:8080` under compose;
#   the gateway Service DNS name under Helm) so the UI calls it
#   same-origin without CORS.
#
# The upstream is resolved at request time via a configurable DNS
# resolver (${GATEWAY_RESOLVER}, default Docker's embedded 127.0.0.11)
# so nginx starts even when the gateway is not yet up and picks up its
# address once it becomes healthy.

server {
    listen 3002;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver ${GATEWAY_RESOLVER} valid=10s ipv6=off;
    set $gateway "${GATEWAY_UPSTREAM}";

    # SSE for synthesis status streaming needs buffering disabled.
    location /api/ {
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass http://$gateway/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /metrics {
        proxy_pass http://$gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed Next.js build assets — safe to cache forever.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The App Router fetches an RSC payload (`index.txt`) when soft-navigating.
    # Only the `scope` placeholder is exported, so for any other scope return
    # 404 rather than the HTML fallback below — that makes Next cleanly fall
    # through to a hard navigation (which the placeholder HTML then serves)
    # instead of trying to parse HTML as an RSC payload.
    location ~ ^/chat/.+/index\.txt$ {
        try_files $uri =404;
    }

    # Chat is a dynamic route. The static export emits a single
    # placeholder page (`/chat/scope/`); every `/chat/<id>` deep link
    # falls back to it and the client reads the real scope from the URL.
    location /chat/ {
        try_files $uri $uri/ /chat/scope/index.html;
        add_header Cache-Control "no-cache";
    }

    # Everything else: serve the matching exported page, then fall back
    # to the SPA shell. `index.html` must never be cached so a redeploy
    # is picked up immediately.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "no-cache";
    }
}
