# Default values for the knowledge chart.
# Mirrors the docker-compose topology: a horizontally-scalable Go gateway
# in front of a single stateful Rust substrate backed by a PersistentVolume
# for the SQLCipher database.

# -- Override the chart name used in resource names (defaults to .Chart.Name).
nameOverride: ""
# -- Override the full release name used in resource names.
fullnameOverride: ""

# Image pull secrets applied to both deployments (for private registries).
imagePullSecrets: []
# - name: ghcr-pull

# ─────────────────────────── Gateway (Go) ───────────────────────────
gateway:
  replicaCount: 2
  image:
    repository: ghcr.io/kennguy3n/knowledge-gateway
    # Defaults to the chart's appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Extra environment variables (list of name/value or name/valueFrom maps).
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ───────────────────────── Substrate (Rust) ─────────────────────────
# The substrate owns the SQLCipher database, so it is single-replica and
# pinned to its PersistentVolume. Do NOT scale it horizontally.
substrate:
  image:
    repository: ghcr.io/kennguy3n/knowledge-substrate
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 9090
  # Absolute path of the SQLCipher database inside the PVC mount.
  storePath: /data/substrate.db
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  persistence:
    enabled: true
    # Reuse an existing PVC instead of creating one (leave empty to create).
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    # Empty uses the cluster default StorageClass; set to "-" to disable
    # dynamic provisioning and bind a pre-provisioned PV.
    storageClass: ""
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # ── Active-passive high availability (WS2) ─────────────────────────
  # When disabled (default) the substrate is a single Deployment replica
  # pinned to one RWO PVC (unchanged behaviour). When enabled it is
  # rendered as a StatefulSet of `replicas` pods, each with its own PVC
  # (volumeClaimTemplate) and a stable DNS name via the headless
  # service. Every pod runs in `auto` role and competes for a NATS KV
  # lease: the winner is primary and ships WAL frames; the others replay
  # them read-only and promote automatically if the primary's lease
  # lapses. This requires:
  #   * a substrate image built with the `replication-nats` cargo
  #     feature (see deploy/Dockerfile.substrate, REPLICATION_NATS=1), and
  #   * a reachable NATS JetStream (`ha.natsUrl`).
  # The substrate is NOT horizontally scalable for writes — only ONE pod
  # is the primary at a time; extra replicas are warm standbys.
  ha:
    enabled: false
    # One primary + (replicas-1) standbys. 2 is the recommended default.
    replicas: 2
    # NATS URL carrying the WAL stream + leadership KV. Defaults to the
    # in-cluster `config.natsUrl` when left empty.
    natsUrl: ""
    # Leadership role passed to each pod. `auto` lets the pods elect a
    # leader via the KV lease (recommended). Override to `primary` /
    # `standby` only for pinned topologies.
    role: auto
  # ── Server-side hierarchical synthesis (domain / tenant tiers) ──────
  # The channel tier (`/synthesis/trigger`) runs on-device via the
  # llama-server sidecar. The server-side domain / tenant tiers
  # (`/synthesis/domain`, `/synthesis/tenant`) dispatch a managed-
  # endpoint synthesis engine installed at boot
  # (substrate_server::configure_synthesis → ffi). Disabled by default:
  # the server-side routes then return 503 (engine unavailable) and only
  # the channel tier is served. Enable to wire the domain→tenant roll-up
  # API end-to-end. The image must be built with the `http-client` cargo
  # feature for the engine to install (else the substrate refuses boot).
  synthesis:
    enabled: false
    # HTTPS URL of the synthesis endpoint. Defaults to the in-cluster
    # llama-server (OpenAI-compatible) when left empty and enabled.
    url: ""
    # Secret-store *reference* for the endpoint API key (never the raw
    # key). Resolved from the pod env at dispatch time.
    apiKeyRef: ""
    # Model identifier forwarded to the endpoint.
    modelId: "slm-recap-v1"
    # Relax the synthesis health probe for single-tenant deployments
    # that run without a scope allow-list. Leave false for the
    # multi-tenant (5k SME) posture and pin scopeBindings instead.
    singleTenant: false
    # Optional comma-separated allow-list of scope UUIDs the engine may
    # serve. Empty allows every scope.
    scopeBindings: ""

# ───────────────────────── End-user UI ──────────────────────────────
# Optional reference web UI (chat / search / memory browser) that serves
# the static Next.js export behind nginx and reverse-proxies the gateway
# API. Disabled by default — set `ui.enabled: true` to deploy it.
ui:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/kennguy3n/knowledge-ui
    # Defaults to the chart's appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3002
  # DNS resolver the UI's nginx uses to resolve the gateway Service name
  # at request time (so it starts before the gateway is ready). This must
  # be the cluster DNS ClusterIP; `10.96.0.10` is the kubeadm/default
  # CoreDNS address — override for clusters that use a different one
  # (`kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'`).
  gatewayResolver: "10.96.0.10"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ─────────────────────── llama-server (SLM) ─────────────────────────
# On-device SLM sidecar serving Qwen3.5-2B Q4_K_M over HTTP. The published
# image ships the GGUF weights baked in (see deploy/Dockerfile.llama-server),
# so synthesis works out of the box — no model download or volume needed.
# When enabled, the substrate is pointed at this service automatically.
# Set enabled=false to run without server-side synthesis (it then returns
# `Unavailable` until a sidecar exists).
llamaServer:
  enabled: true
  # Size of the shared synthesis pool. The SLM is CPU-bound and the
  # weights are baked into the image (no shared state), so it scales
  # horizontally: the Service round-robins across replicas. For 5k SME
  # tenants this is the primary capacity knob for the synthesis path —
  # raise it together with config.synthesis.globalConcurrency so the
  # gateway's global fair-share cap tracks the real pool size. See
  # docs/operator/multitenant-5k.md.
  replicaCount: 1
  image:
    repository: ghcr.io/kennguy3n/knowledge-llama-server
    # Defaults to the chart's appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8081
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ──────────────────────── Non-secret config ─────────────────────────
# Rendered into a ConfigMap and injected into the gateway. See
# docs/operator/deployment-guide.md for the full variable reference.
config:
  rateIpRps: 50
  rateTenantRps: 200
  rateBurst: 100
  # Per-tenant synthesis fair-share over the shared, CPU-bound
  # llama-server pool: bounds any one tenant's concurrent syntheses so a
  # single tenant cannot starve the other 4,999. Enforced by the gateway
  # (server/internal/middleware fair-share admission). See
  # docs/operator/multitenant-5k.md for sizing at 5k tenants.
  synthesis:
    # Max concurrent syntheses a single tenant may hold.
    tenantConcurrency: 2
    # Bounded per-tenant FIFO wait slots once at the cap; excess is shed
    # with 429 + Retry-After rather than queued unboundedly.
    tenantQueue: 4
    # Max concurrent syntheses across ALL tenants. MUST track the
    # llama-server pool (≈ llamaServer.replicaCount × per-replica
    # parallelism, ~2/replica) so the pool is saturated but never
    # oversubscribed. The default matches the default 1-replica pool
    # (1 × 2). When you raise llamaServer.replicaCount, raise this in
    # step (e.g. 4 replicas ⇒ 8). See docs/operator/multitenant-5k.md.
    globalConcurrency: 2
    # How long a queued synthesis waits for a slot before shedding.
    queueWait: 5s
  # Comma-separated CORS allow-list; empty means "*".
  corsOrigins: ""
  syncInterval: 15m
  # Externally reachable base URL (OAuth callbacks); set to your Ingress host.
  publicBaseUrl: "http://localhost:8080"
  # External Postgres DSN. Empty keeps the gateway on its in-memory store
  # (fine for evaluation, NOT for production).
  databaseUrl: ""
  # External NATS JetStream URL. Empty disables the audit pipeline.
  natsUrl: ""

# ───────────────────────────── Secrets ──────────────────────────────
# masterKey is REQUIRED for the substrate to start. Generate with
# `openssl rand -hex 32`. Prefer `existingSecret` in production and keep
# the value out of values.yaml / version control.
secrets:
  # Render a Secret from the values below. Set false when using existingSecret.
  create: true
  # Name of a pre-existing Secret holding KNOWLEDGE_MASTER_KEY (and
  # optionally KNOWLEDGE_API_KEY / KNOWLEDGE_JWT_SECRET). Takes precedence.
  existingSecret: ""
  # 64-hex-char SQLCipher master key. MUST be set before install.
  masterKey: ""
  # Optional static bearer token for admin/service calls (empty disables).
  apiKey: ""
  # Optional HMAC secret for tenant JWT validation (empty disables).
  jwtSecret: ""

# ─────────────────────────── Autoscaling ────────────────────────────
# HPA for the gateway only (the substrate is stateful and single-replica).
# The gateway is stateless, so it scales out freely; enable this in
# production. For 5k SME tenants a min of 3 (spread across zones) with a
# max of ~20 at 70% CPU is a sound starting point — see
# docs/operator/multitenant-5k.md for the full sizing rationale.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # Set to enable memory-based scaling (null disables it).
  targetMemoryUtilizationPercentage: null

# ───────────────────────────── Ingress ──────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: knowledge.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: knowledge-tls
  #   hosts:
  #     - knowledge.local

# ──────────────────────── Pod / SA settings ─────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Applied to both pods. Kept conservative so the published images run
# unmodified: the gateway uses a distroless base (root) and the substrate
# runs as a named (non-numeric) system user, so `runAsNonRoot` is left
# unset to avoid the kubelet "cannot verify non-root user" rejection.
# Tighten these once the images ship a numeric non-root UID.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
