apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "knowledge.substrate.fullname" . }}-config
  labels:
    {{- include "knowledge.labels" . | nindent 4 }}
    app.kubernetes.io/component: substrate
data:
  KNOWLEDGE_SUBSTRATE_ADDR: "0.0.0.0:{{ .Values.substrate.service.port }}"
  KNOWLEDGE_STORE_PATH: {{ .Values.substrate.storePath | quote }}
