apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "knowledge.substrate.fullname" . }}-config
  labels:
    {{- include "knowledge.labels" . | nindent 4 }}
    app.kubernetes.io/component: substrate
data:
  KNOWLEDGE_SUBSTRATE_ADDR: "0.0.0.0:{{ .Values.substrate.service.port }}"
  KNOWLEDGE_STORE_PATH: {{ .Values.substrate.storePath | quote }}
  {{- if .Values.llamaServer.enabled }}
  # Point the substrate at the in-cluster llama-server sidecar so
  # `trigger_synthesis` dispatches to the on-device SLM out of the box.
  KNOWLEDGE_LLAMA_SERVER_URL: {{ include "knowledge.llamaServer.url" . | quote }}
  # Pin the device tier to `high` so synthesis is enabled regardless of
  # the container's cgroup-detected RAM (which would otherwise auto-detect
  # to a lower tier and silently disable synthesis). Override per-deploy
  # via `substrate.extraEnv` if needed.
  KNOWLEDGE_SLM_DEVICE_TIER: "high"
  {{- end }}
  {{- if .Values.substrate.synthesis.enabled }}
  # ── Server-side hierarchical synthesis (domain / tenant tiers) ──
  # Installs the managed-endpoint synthesis engine at boot so the
  # `/synthesis/domain` and `/synthesis/tenant` routes dispatch real
  # roll-ups. Defaults the endpoint to the in-cluster llama-server when
  # `url` is empty *and* the sidecar is enabled. The API key itself is
  # NOT here — only a secret-store reference; set the referenced var via
  # `substrate.extraEnv` / a Secret. The substrate image must be built
  # with `http-client`.
  {{- $llamaURL := include "knowledge.llamaServer.url" . }}
  {{- $synthURL := .Values.substrate.synthesis.url | default (ternary (printf "%s/v1/chat/completions" $llamaURL) "" (ne $llamaURL "")) }}
  {{- if not $synthURL }}
  {{- fail "substrate.synthesis.enabled=true but no synthesis endpoint could be resolved: set substrate.synthesis.url, or enable the in-cluster sidecar (llamaServer.enabled=true) to fall back to it" }}
  {{- end }}
  KNOWLEDGE_SYNTHESIS_URL: {{ $synthURL | quote }}
  KNOWLEDGE_SYNTHESIS_API_KEY_REF: {{ .Values.substrate.synthesis.apiKeyRef | quote }}
  KNOWLEDGE_SYNTHESIS_MODEL_ID: {{ .Values.substrate.synthesis.modelId | quote }}
  KNOWLEDGE_SYNTHESIS_SINGLE_TENANT: {{ ternary "1" "0" .Values.substrate.synthesis.singleTenant | quote }}
  {{- with .Values.substrate.synthesis.scopeBindings }}
  KNOWLEDGE_SYNTHESIS_SCOPE_BINDINGS: {{ . | quote }}
  {{- end }}
  {{- end }}
