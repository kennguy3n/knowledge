apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowledge.gateway.fullname" . }}
  labels:
    {{- include "knowledge.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "knowledge.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the gateway when its config or the secret content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-gateway.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "knowledge.gateway.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "knowledge.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "knowledge.gateway.image" . }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "knowledge.gateway.fullname" . }}-config
          env:
            # Optional auth secrets — `optional: true` so they may be
            # absent from the Secret (auth simply stays disabled).
            - name: KNOWLEDGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "knowledge.secretName" . }}
                  key: KNOWLEDGE_API_KEY
                  optional: true
            - name: KNOWLEDGE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "knowledge.secretName" . }}
                  key: KNOWLEDGE_JWT_SECRET
                  optional: true
            {{- with .Values.gateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
