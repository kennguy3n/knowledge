apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "knowledge.fullname" . }}-config
  labels:
    {{- include "knowledge.labels" . | nindent 4 }}
data:
  # Gateway → substrate loopback (in-cluster service DNS).
  KNOWLEDGE_GATEWAY_ADDR: ":{{ .Values.gateway.service.port }}"
  KNOWLEDGE_SUBSTRATE_URL: "http://{{ include "knowledge.substrate.fullname" . }}:{{ .Values.substrate.service.port }}"
  KNOWLEDGE_RATE_IP_RPS: {{ .Values.config.rateIpRps | quote }}
  KNOWLEDGE_RATE_TENANT_RPS: {{ .Values.config.rateTenantRps | quote }}
  KNOWLEDGE_RATE_BURST: {{ .Values.config.rateBurst | quote }}
  KNOWLEDGE_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  KNOWLEDGE_SYNC_INTERVAL: {{ .Values.config.syncInterval | quote }}
  KNOWLEDGE_PUBLIC_BASE_URL: {{ .Values.config.publicBaseUrl | quote }}
  {{- with .Values.config.databaseUrl }}
  KNOWLEDGE_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.natsUrl }}
  KNOWLEDGE_NATS_URL: {{ . | quote }}
  {{- end }}
  # Substrate config.
  KNOWLEDGE_SUBSTRATE_ADDR: "0.0.0.0:{{ .Values.substrate.service.port }}"
  KNOWLEDGE_STORE_PATH: {{ .Values.substrate.storePath | quote }}
