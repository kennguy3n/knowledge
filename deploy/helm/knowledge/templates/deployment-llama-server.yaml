{{- if .Values.llamaServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowledge.llamaServer.fullname" . }}
  labels:
    {{- include "knowledge.labels" . | nindent 4 }}
    app.kubernetes.io/component: llama-server
spec:
  # Single replica: a small on-device SLM sidecar. The model weights are
  # baked into the image, so there is no shared state to coordinate.
  replicas: 1
  selector:
    matchLabels:
      {{- include "knowledge.llamaServer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.llamaServer.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "knowledge.llamaServer.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "knowledge.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: llama-server
          image: {{ include "knowledge.llamaServer.image" . }}
          imagePullPolicy: {{ .Values.llamaServer.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.llamaServer.service.port }}
          {{- with .Values.llamaServer.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The model is baked into the image, so load is fast — but give
          # the SLM a generous startup window before liveness kicks in.
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.llamaServer.resources | nindent 12 }}
      {{- with .Values.llamaServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llamaServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llamaServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
