{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- if .Values.secrets.masterKey }}
{{- if not (regexMatch "^[0-9a-fA-F]{64}$" .Values.secrets.masterKey) }}
{{- fail "secrets.masterKey must be 64 hexadecimal characters (generate with `openssl rand -hex 32`)" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "knowledge.secretName" . }}
  labels:
    {{- include "knowledge.labels" . | nindent 4 }}
type: Opaque
stringData:
  # REQUIRED by the substrate. An empty value renders here but the
  # substrate fails closed on boot — set secrets.masterKey before install.
  KNOWLEDGE_MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
  {{- with .Values.secrets.apiKey }}
  KNOWLEDGE_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.jwtSecret }}
  KNOWLEDGE_JWT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
