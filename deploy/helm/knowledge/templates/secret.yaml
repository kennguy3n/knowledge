{{- include "knowledge.validateMasterKey" . }}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "knowledge.secretName" . }}
  labels:
    {{- include "knowledge.labels" . | nindent 4 }}
type: Opaque
stringData:
  # REQUIRED by the substrate. `knowledge.validateMasterKey` (invoked
  # above) rejects an empty or malformed key at install time, so this
  # always renders a 64-hex-char value.
  KNOWLEDGE_MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
  {{- with .Values.secrets.apiKey }}
  KNOWLEDGE_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.jwtSecret }}
  KNOWLEDGE_JWT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
