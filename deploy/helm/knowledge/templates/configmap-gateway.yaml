apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "knowledge.gateway.fullname" . }}-config
  labels:
    {{- include "knowledge.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  KNOWLEDGE_GATEWAY_ADDR: ":{{ .Values.gateway.service.port }}"
  {{- if .Values.substrate.ha.enabled }}
  # HA: address substrate pods by their stable StatefulSet DNS names so
  # the gateway can pin writes to the current primary and fail over to a
  # promoted standby. The gateway probes /health on each URL and routes
  # writes to whichever reports `role = primary` (see
  # server/internal/substrate), so ordinal-0 is only the initial guess.
  KNOWLEDGE_SUBSTRATE_URL: "http://{{ include "knowledge.substrate.fullname" . }}-0.{{ include "knowledge.substrate.fullname" . }}-headless:{{ .Values.substrate.service.port }}"
  {{- if gt (int .Values.substrate.ha.replicas) 1 }}
  KNOWLEDGE_SUBSTRATE_URL_STANDBY: "http://{{ include "knowledge.substrate.fullname" . }}-1.{{ include "knowledge.substrate.fullname" . }}-headless:{{ .Values.substrate.service.port }}"
  {{- end }}
  {{- else }}
  # In-cluster service DNS for the substrate.
  KNOWLEDGE_SUBSTRATE_URL: "http://{{ include "knowledge.substrate.fullname" . }}:{{ .Values.substrate.service.port }}"
  {{- end }}
  KNOWLEDGE_RATE_IP_RPS: {{ .Values.config.rateIpRps | quote }}
  KNOWLEDGE_RATE_TENANT_RPS: {{ .Values.config.rateTenantRps | quote }}
  KNOWLEDGE_RATE_BURST: {{ .Values.config.rateBurst | quote }}
  KNOWLEDGE_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  KNOWLEDGE_SYNC_INTERVAL: {{ .Values.config.syncInterval | quote }}
  KNOWLEDGE_PUBLIC_BASE_URL: {{ .Values.config.publicBaseUrl | quote }}
  {{- with .Values.config.databaseUrl }}
  KNOWLEDGE_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.natsUrl }}
  KNOWLEDGE_NATS_URL: {{ . | quote }}
  {{- end }}
