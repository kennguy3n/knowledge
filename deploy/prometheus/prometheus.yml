# Prometheus scrape configuration for the knowledge stack.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Go API gateway — basic request counters at /metrics.
  - job_name: knowledge-gateway
    static_configs:
      - targets:
          - knowledge-gateway:8080
    metrics_path: /metrics
    scrape_interval: 10s

  # Go API gateway — observability metrics (knowledge_* prefix) at
  # /metrics/knowledge. Includes per-tenant, connector, synthesis,
  # ingest/query counters and Go process/runtime collectors.
  - job_name: knowledge-gateway-observability
    static_configs:
      - targets:
          - knowledge-gateway:8080
    metrics_path: /metrics/knowledge
    scrape_interval: 10s

  # Rust substrate_server — exposes /internal/metrics on port 9090.
  - job_name: knowledge-substrate
    static_configs:
      - targets:
          - knowledge-substrate:9090
    metrics_path: /internal/metrics
    scrape_interval: 10s
