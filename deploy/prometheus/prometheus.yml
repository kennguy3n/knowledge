global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "knowledge-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["knowledge-gateway:8080"]
        labels:
          service: gateway

  - job_name: "knowledge-substrate"
    metrics_path: /substrate/metrics
    static_configs:
      - targets: ["knowledge-substrate:9090"]
        labels:
          service: substrate
