# Knowledge stack — docker compose deployment.
# See docs/operator/deployment-guide.md for configuration and operational docs.
#
# Each first-party service declares BOTH `build:` and `image:`. The
# `image:` value names the published artifact (defaulting to the
# `ghcr.io` images produced by `.github/workflows/release.yml` on a
# `v*` tag); the `build:` block stays so a source checkout can still
# `docker compose build` locally. To run pre-built images instead of
# building, pin a released tag and pull:
#
#   KNOWLEDGE_IMAGE_TAG=v1.0.0 docker compose pull && \
#   KNOWLEDGE_IMAGE_TAG=v1.0.0 docker compose up -d
#
# `docker compose up` (without `pull`) still builds from source when
# the named image is absent locally, so the default workflow is
# unchanged. See docs/operator/upgrading.md for the version policy.
#
# REQUIREMENT: the `image:` values use nested defaults
# (`${IMAGE:-…:${TAG:-latest}}`), which need Docker Compose v2.20.0+
# (the version that added nested variable interpolation). On older
# Compose the inner `${…}` is taken literally and the pull will fail
# with a malformed reference. Check with `docker compose version`;
# v2.20.0 shipped with Docker Engine 24.0.6 (Sept 2023).

services:
  # ────────────────── Core services ──────────────────────────────────

  knowledge-gateway:
    image: "${KNOWLEDGE_GATEWAY_IMAGE:-ghcr.io/kennguy3n/knowledge/gateway:${KNOWLEDGE_IMAGE_TAG:-latest}}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      KNOWLEDGE_GATEWAY_ADDR: ":8080"
      KNOWLEDGE_SUBSTRATE_URL: "http://knowledge-substrate:9090"
      KNOWLEDGE_DATABASE_URL: "postgres://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}@postgres:5432/${POSTGRES_DB:-knowledge}?sslmode=disable"
      KNOWLEDGE_NATS_URL: "nats://nats:4222"
      KNOWLEDGE_API_KEY: "${KNOWLEDGE_API_KEY:-}"
      KNOWLEDGE_JWT_SECRET: "${KNOWLEDGE_JWT_SECRET:-}"
      KNOWLEDGE_RATE_IP_RPS: "${KNOWLEDGE_RATE_IP_RPS:-50}"
      KNOWLEDGE_RATE_TENANT_RPS: "${KNOWLEDGE_RATE_TENANT_RPS:-200}"
      KNOWLEDGE_RATE_BURST: "${KNOWLEDGE_RATE_BURST:-100}"
      # Per-tenant synthesis fair-share. globalConcurrency defaults to 2
      # to match the single llama-server in this compose stack (do not
      # oversubscribe it). See docs/operator/multitenant-5k.md.
      KNOWLEDGE_SYNTHESIS_TENANT_CONCURRENCY: "${KNOWLEDGE_SYNTHESIS_TENANT_CONCURRENCY:-2}"
      KNOWLEDGE_SYNTHESIS_TENANT_QUEUE: "${KNOWLEDGE_SYNTHESIS_TENANT_QUEUE:-4}"
      KNOWLEDGE_SYNTHESIS_GLOBAL_CONCURRENCY: "${KNOWLEDGE_SYNTHESIS_GLOBAL_CONCURRENCY:-2}"
      KNOWLEDGE_SYNTHESIS_QUEUE_WAIT: "${KNOWLEDGE_SYNTHESIS_QUEUE_WAIT:-5s}"
      KNOWLEDGE_CORS_ORIGINS: "${KNOWLEDGE_CORS_ORIGINS:-}"
      KNOWLEDGE_SYNC_INTERVAL: "${KNOWLEDGE_SYNC_INTERVAL:-15m}"
      KNOWLEDGE_PUBLIC_BASE_URL: "${KNOWLEDGE_PUBLIC_BASE_URL:-http://localhost:8080}"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      knowledge-substrate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  knowledge-substrate:
    image: "${KNOWLEDGE_SUBSTRATE_IMAGE:-ghcr.io/kennguy3n/knowledge/substrate:${KNOWLEDGE_IMAGE_TAG:-latest}}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.substrate
      args:
        # Set REPLICATION_NATS=1 to link the NATS replication transport
        # (required for the active-passive HA described below).
        REPLICATION_NATS: "${REPLICATION_NATS:-0}"
    environment:
      KNOWLEDGE_SUBSTRATE_ADDR: "0.0.0.0:9090"
      KNOWLEDGE_STORE_PATH: "/data/substrate.db"
      KNOWLEDGE_MASTER_KEY: "${KNOWLEDGE_MASTER_KEY}"
      # Auto-discover the llama.cpp sidecar so `trigger_synthesis`
      # dispatches the on-device SLM out of the box. The substrate
      # reads this at boot (see `HttpLlamaServerClient::from_env`) and
      # points the llama.cpp InferenceRouter adapter at the sidecar.
      KNOWLEDGE_LLAMA_SERVER_URL: "http://llama-server:8081"
      # Synthesis (`SynthSummary`) is only served at the `high` device
      # tier; pin it here so a server deployment supports synthesis
      # regardless of the container's detected RAM (which would
      # otherwise auto-detect to `medium` under a cgroup memory limit
      # and silently disable synthesis). Override per-host if needed.
      KNOWLEDGE_SLM_DEVICE_TIER: "${KNOWLEDGE_SLM_DEVICE_TIER:-high}"
      # ── Active-passive replication (WS2) ──────────────────────────
      # Default `disabled` keeps a single standalone substrate (the WAL
      # is never shipped and `/health` reports `replication.enabled =
      # false`). To enable WAL-shipped failover:
      #   1. Build the substrate image with the `replication-nats`
      #      cargo feature: `REPLICATION_NATS=1 docker compose build
      #      knowledge-substrate` (see deploy/Dockerfile.substrate).
      #   2. Set KNOWLEDGE_SUBSTRATE_ROLE=primary here (or `auto`).
      #   3. Uncomment the `knowledge-substrate-standby` service below.
      # Both nodes ship/replay frames over the shared NATS JetStream
      # already in this stack.
      KNOWLEDGE_SUBSTRATE_ROLE: "${KNOWLEDGE_SUBSTRATE_ROLE:-disabled}"
      KNOWLEDGE_REPLICATION_NATS_URL: "${KNOWLEDGE_REPLICATION_NATS_URL:-nats://nats:4222}"
      # Optional managed-cloud synthesis. When KNOWLEDGE_MANAGED_INFERENCE_URL
      # is set, the substrate wires a ManagedCloudAdapter (see
      # `build_inference_router`) that routes synthesis to an external
      # OpenAI-compatible endpoint (OpenAI / Groq / Together / Ollama / …)
      # instead of the self-hosted llama-server. Left empty by default, so
      # the adapter stays disabled and synthesis uses the local SLM.
      KNOWLEDGE_MANAGED_INFERENCE_URL: "${KNOWLEDGE_MANAGED_INFERENCE_URL:-}"
      KNOWLEDGE_MANAGED_INFERENCE_KEY: "${KNOWLEDGE_MANAGED_INFERENCE_KEY:-}"
      KNOWLEDGE_MANAGED_INFERENCE_MODEL: "${KNOWLEDGE_MANAGED_INFERENCE_MODEL:-gpt-4o-mini}"
      # ── Server-side hierarchical synthesis (domain / tenant tiers) ──
      # The channel tier (`/synthesis/trigger`) runs on-device via the
      # inference router above. The server-side domain / tenant tiers
      # (`/synthesis/domain`, `/synthesis/tenant`) instead dispatch the
      # managed-endpoint synthesis engine installed from these vars at
      # boot (substrate_server::configure_synthesis →
      # ffi::configure_synthesis_engine). Leave KNOWLEDGE_SYNTHESIS_URL
      # empty (default) to run with only the channel tier; the
      # server-side routes then return 503 (engine unavailable). The
      # llama-server sidecar speaks an OpenAI-compatible API, so it can
      # back the server tiers too — point the URL at it to enable
      # domain/tenant roll-ups out of the box.
      KNOWLEDGE_SYNTHESIS_URL: "${KNOWLEDGE_SYNTHESIS_URL:-}"
      # Secret-store *reference* for the endpoint API key — never the
      # raw key. The engine resolves it from the process env at dispatch
      # time. Required (non-empty) once KNOWLEDGE_SYNTHESIS_URL is set.
      KNOWLEDGE_SYNTHESIS_API_KEY_REF: "${KNOWLEDGE_SYNTHESIS_API_KEY_REF:-}"
      KNOWLEDGE_SYNTHESIS_MODEL_ID: "${KNOWLEDGE_SYNTHESIS_MODEL_ID:-slm-recap-v1}"
      # Single-tenant deployments may legitimately run without a scope
      # allow-list; set to 1 to keep the synthesis health probe Nominal
      # in that posture. Multi-tenant (5k SME) deployments should leave
      # this unset and instead pin KNOWLEDGE_SYNTHESIS_SCOPE_BINDINGS.
      KNOWLEDGE_SYNTHESIS_SINGLE_TENANT: "${KNOWLEDGE_SYNTHESIS_SINGLE_TENANT:-}"
    volumes:
      - substrate-data:/data
    depends_on:
      # NATS carries the WAL stream + leadership KV when replication is
      # enabled; it is always in the stack so gating here is harmless
      # for the default standalone (disabled) substrate too.
      nats:
        condition: service_healthy
      # Start the sidecar first for ordering, but only gate on the
      # container having STARTED — not on its health. The llama.cpp
      # adapter probes `/health` live on every dispatch (see
      # `LlamaCppAdapter::is_available`), so synthesis self-heals the
      # moment the model finishes loading; there is no need to block the
      # substrate's boot on it. Gating on `service_healthy` here would
      # still be a footgun: `llama-server` only reports healthy once the
      # model has loaded, so blocking the substrate (and, transitively,
      # the gateway) on it would couple the whole stack's boot to model
      # load time. With `service_started` the stack always comes up and
      # synthesis simply returns `Unavailable` until the sidecar is
      # healthy (the bundled model means that is normally only a brief
      # window after start).
      llama-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/internal/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # WS8 lazy-load: `open_store` no longer probes the llama.cpp
      # adapter at boot (the probe is a `GET /health` with a multi-second
      # timeout, deferred to the first synthesis request — see
      # `InferenceRouter::ensure_bootstrap_started`). With the probe off
      # the boot path, startup is dominated by process/runtime init plus
      # the store open, which measures ~13 ms cold / ~3 ms warm in CI
      # (Linux x86-64 VM; see docs/technical/benchmarks.md "Startup").
      # The old 20s budget existed to absorb that eager probe, so drop it
      # to 5s — still ~300x the measured open and a generous cushion for
      # binary load + Axum bind. `retries: 5` @ `interval: 10s` adds a
      # further 50s of post-start grace regardless.
      start_period: 5s
    restart: unless-stopped

  # ────────────────── Substrate standby (WS2 — opt-in HA) ────────────
  # A second substrate that replays WAL frames shipped by the primary
  # over NATS JetStream and serves read-only queries until promoted.
  # Disabled by default; uncomment to enable active-passive failover.
  #
  # Prerequisites:
  #   * Build the substrate image with the `replication-nats` feature
  #     (REPLICATION_NATS=1 — see deploy/Dockerfile.substrate).
  #   * Set the primary's KNOWLEDGE_SUBSTRATE_ROLE to `primary` (or run
  #     both as `auto` to let them elect a leader via the NATS KV lock).
  #   * Point the gateway at it: KNOWLEDGE_SUBSTRATE_URL_STANDBY=
  #     http://knowledge-substrate-standby:9090
  #
  # knowledge-substrate-standby:
  #   image: "${KNOWLEDGE_SUBSTRATE_IMAGE:-ghcr.io/kennguy3n/knowledge/substrate:${KNOWLEDGE_IMAGE_TAG:-latest}}"
  #   build:
  #     context: ..
  #     dockerfile: deploy/Dockerfile.substrate
  #     args:
  #       REPLICATION_NATS: "1"
  #   environment:
  #     KNOWLEDGE_SUBSTRATE_ADDR: "0.0.0.0:9090"
  #     # Its own shadow copy — never share a volume with the primary.
  #     KNOWLEDGE_STORE_PATH: "/data/substrate.db"
  #     KNOWLEDGE_MASTER_KEY: "${KNOWLEDGE_MASTER_KEY}"
  #     KNOWLEDGE_LLAMA_SERVER_URL: "http://llama-server:8081"
  #     KNOWLEDGE_SLM_DEVICE_TIER: "${KNOWLEDGE_SLM_DEVICE_TIER:-high}"
  #     KNOWLEDGE_SUBSTRATE_ROLE: standby
  #     KNOWLEDGE_REPLICATION_NATS_URL: nats://nats:4222
  #   volumes:
  #     - substrate-standby-data:/data
  #   depends_on:
  #     nats:
  #       condition: service_healthy
  #     llama-server:
  #       condition: service_started
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -qO- http://localhost:9090/internal/metrics || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 20s
  #   restart: unless-stopped

  # ────────────────── Admin web UI ───────────────────────────────────

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    # The nginx image serves the SPA on 3001 and reverse-proxies the
    # gateway API surface (/api, /health, /metrics) to the
    # knowledge-gateway service on the compose network, so the SPA can
    # call the gateway same-origin without CORS configuration.
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    depends_on:
      knowledge-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ────────────────── End-user web UI ────────────────────────────────

  knowledge-ui:
    build:
      context: ../apps/knowledge-ui
      dockerfile: Dockerfile
    # The nginx image serves the static Next.js export on 3002 and
    # reverse-proxies the gateway API surface (/api, /health, /metrics)
    # to the knowledge-gateway service on the compose network, so the UI
    # calls the gateway same-origin without CORS configuration.
    ports:
      - "${UI_PORT:-3002}:3002"
    depends_on:
      knowledge-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ────────────────── Infrastructure ─────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-knowledge}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}"
      POSTGRES_DB: "${POSTGRES_DB:-knowledge}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  nats:
    # Pinned to the Alpine variant (not `latest`): the default `nats`
    # image is distroless (no shell, no wget), so the `wget`-based
    # healthcheck below can never execute and the container is reported
    # unhealthy forever. The Alpine variant ships BusyBox (sh + wget).
    image: nats:2.10-alpine
    # `-m 8222` enables the HTTP monitoring server that exposes
    # `/healthz`; without it the healthcheck probe connects to a closed
    # port. JetStream (`-js`) + store dir are unchanged.
    command: ["-js", "-sd", "/data/nats", "-m", "8222"]
    volumes:
      - nats-data:/data/nats
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set (see .env.example)}"
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET:-knowledge};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set (see .env.example)}"
      MINIO_BUCKET: "${MINIO_BUCKET:-knowledge}"

  llama-server:
    image: "${KNOWLEDGE_LLAMA_IMAGE:-ghcr.io/kennguy3n/knowledge/llama-server:${KNOWLEDGE_IMAGE_TAG:-latest}}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.llama-server
    # No volume mount is required: the image ships with Qwen3.5-2B baked
    # in at /models/slm.gguf, so synthesis works out of the box.
    # To run a DIFFERENT model, bind-mount it over the baked-in path as an
    # override (uncomment and point at your own GGUF):
    #   volumes:
    #     - "${LLAMA_MODEL_DIR:-./models}/slm.gguf:/models/slm.gguf:ro"
    ports:
      - "${LLAMA_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # The model is already on disk in the image, so it loads quickly
      # — a shorter grace period than a runtime download would need.
      start_period: 30s
    restart: unless-stopped

  # ────────────────── Observability ──────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set (see .env.example)}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
  minio-data:
  substrate-data:
  # Standby's own shadow copy — only used when the commented-out
  # `knowledge-substrate-standby` service above is enabled.
  substrate-standby-data:
  prometheus-data:
  grafana-data:
