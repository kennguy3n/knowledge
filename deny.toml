# `cargo deny check` configuration.
#
# Schema follows cargo-deny's stable post-0.14 layout — security
# advisories live under `[advisories]`, license policy under
# `[licenses]`, dependency bans under `[bans]`, and source allow-lists
# under `[sources]`.

[advisories]
# Fail the build on any known vulnerability in a transitive dep. The
# corresponding `[deprecated]` boolean keys (`vulnerability`,
# `unmaintained`, `yanked`) were the pre-0.14 cargo-deny schema; the
# `version = 2` opt-in below selects the modern, stricter handling
# where these used to be implicit.
version = 2
# Yanked crates almost always indicate a known-bad release; treat
# any in the lockfile as a hard failure rather than a warning.
yanked = "deny"
# Allow specific advisories or yanked crates only through explicit,
# version-pinned ignore entries. Every entry below is an
# *unmaintained* advisory (not a vulnerability) for which there is no
# maintained drop-in replacement; each was reviewed individually per
# the exception process in docs/security/supply-chain.md. Revisit on
# every dependency-update cycle — drop an entry the moment a fixed /
# maintained release or an actual vulnerability appears.
ignore = [
    # ── PQClean-backed SPHINCS+ stateless-hash PQ signatures ─────────
    # The `pqcrypto-*` family wraps the PQClean C reference
    # implementation of SPHINCS+-SHAKE-128f-simple (our FIPS 205
    # stateless hash-based signature backend in `crates/crypto`). On
    # 2026-06-04 RustSec flagged the family `unmaintained` because the
    # upstream PQClean project is being archived. This is an
    # *unmaintained* notice, NOT a vulnerability:
    #   * SPHINCS+ / SLH-DSA is a finalised NIST standard (FIPS 205);
    #     the reference implementation is frozen by design, so an
    #     archived upstream does not leave a moving security target.
    #   * There is currently no maintained pure-Rust SPHINCS+ crate
    #     with an equivalent audited PQClean-derived backend, so we
    #     cannot swap it without regressing the audited surface.
    # We keep the dep and re-evaluate each update cycle; if a CVE is
    # ever published against it, this ignore does NOT mask it (those
    # are `vulnerability` advisories, still hard-failed above).
    "RUSTSEC-2026-0160", # pqcrypto-sphincsplus unmaintained
    "RUSTSEC-2026-0162", # pqcrypto-traits unmaintained
    "RUSTSEC-2026-0163", # pqcrypto-internals unmaintained
]

[licenses]
version = 2
# SPDX identifiers we explicitly accept across the workspace tree.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # MPL-2.0 is file-level copyleft (modifications to MPL'd source
    # files must be released under MPL, but linking does NOT taint the
    # workspace). uniffi and its sub-crates (uniffi, uniffi_bindgen,
    # uniffi_core, uniffi_internal_macros, uniffi_macros, uniffi_meta,
    # uniffi_udl) are all MPL-2.0 and are core dependencies of the
    # FFI substrate (Swift/Kotlin bindings).
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # CDLA-Permissive-2.0 is the Community Data License Agreement
    # Permissive 2.0 — an SPDX-recognised permissive data license
    # used by Mozilla for the trusted-CA bundle that ships with
    # `webpki-roots`. `webpki-roots` is pulled in transitively by
    # `hyper-rustls -> reqwest` once the connectors crate's
    # dev-dep activates the `http-client` feature on
    # `connector_framework`. The license has no copyleft or share-
    # alike clause — distribution under any terms is permitted —
    # so it's safe to ship alongside the rest of the workspace's
    # MIT/Apache code.
    "CDLA-Permissive-2.0",
]
# Any license outside the allow-list above fails the build (the
# default once `version = 2` is set).

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
