[workspace]
resolver = "2"
members = [
    "crates/agent_contract",
    "crates/audit_service",
    "crates/concept_graph",
    "crates/connector_framework",
    "crates/connectors",
    "crates/crypto",
    "crates/demo",
    "crates/evidence_store",
    "crates/export_plane",
    "crates/ffi",
    "crates/inference_router",
    "crates/memory_manager",
    "crates/napi",
    "crates/observation_engine",
    "crates/permission_service",
    "crates/reasoning_engine",
    "crates/sync_engine",
    "crates/synthesis_engine",
    "crates/synthesis_pipeline",
    "crates/tenant_service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/kennguy3n/knowledge"

[workspace.dependencies]
# Errors
thiserror = "1"

# IDs
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Hashing / AEAD / KDF / MAC
blake3 = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"

# Post-quantum + classical KEM
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = { version = "0.2", features = ["std"] }

# Post-quantum signatures (RustCrypto pre-release; Phase 7 ML-DSA-65 backend)
ml-dsa = "0.0.4"

# Storage
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "blob"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Tests
tempfile = "3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (used by `inference_router`'s `http-client` feature to
# talk to the llama.cpp loopback `llama-server`). Blocking +
# rustls-tls so we don't pull in tokio for the synchronous
# inference path.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
float_cmp = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
ignored_unit_patterns = "allow"
explicit_iter_loop = "allow"
needless_raw_string_hashes = "allow"
type_complexity = "allow"
single_match = "allow"
items_after_statements = "allow"
unreadable_literal = "allow"
uninlined_format_args = "allow"
needless_continue = "allow"
match_same_arms = "allow"
