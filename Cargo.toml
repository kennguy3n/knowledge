[workspace]
resolver = "2"
exclude = ["crates/crypto/fuzz", "crates/evidence_store/fuzz"]
members = [
    "crates/agent_contract",
    "crates/audit_service",
    "crates/benchmarks",
    "crates/concept_graph",
    "crates/connector_framework",
    "crates/connectors",
    "crates/crypto",
    "crates/demo",
    "crates/evidence_store",
    "crates/export_plane",
    "crates/ffi",
    "crates/inference_router",
    "crates/integration_tests",
    "crates/memory_manager",
    "crates/ner_engine",
    "crates/napi",
    "crates/observation_engine",
    "crates/permission_service",
    "crates/reasoning_engine",
    "crates/substrate_server",
    "crates/sync_engine",
    "crates/sync_relay",
    "crates/synthesis_engine",
    "crates/synthesis_pipeline",
    "crates/tenant_service",
    "crates/uniffi-bindgen",
]

# The bench profile inherits from release (no debug_assertions), which
# triggers the compile_error! guards in crates that gate test-support
# behind `not(debug_assertions)`. We enable debug-assertions for
# benchmarks so dev-dependencies with test-support features compile
# correctly under `cargo bench`.
[profile.bench]
debug-assertions = true

[workspace.package]
version = "1.2.0"
# Workspace crates stay on Rust 2021 even though some dependencies
# (notably `ml-dsa = "0.1.0"`) declare `edition = "2024"`. Cargo edition
# is per-crate, not per-dependency-graph — a workspace crate on 2021
# may freely depend on a 2024-edition crate. We keep 2021 here to:
#   1. avoid churn on the `let chain` / `gen` / new safety rules in
#      2024 across the ~20-crate workspace until we have explicit
#      reason to migrate;
#   2. keep the MSRV signalled by `rust-version` honest — the floor
#      below is set by our security-patched dependency tree, not by our
#      crates' own surface.
# Bump to 2024 in a dedicated PR (so `cargo fix --edition` migration
# noise is reviewable on its own).
edition = "2021"
# MSRV floor is `1.88`. It was `1.85` (set by `ml-dsa`'s internal
# `edition = "2024"`) until the security-patched `async-nats 0.49`
# subtree — pulled in to clear the `rustls-webpki 0.102` advisories
# (RUSTSEC-2026-0049/-0098/-0099/-0104) and the `time 0.3.45` DoS
# (RUSTSEC-2026-0009) — raised it to `1.88` via `time 0.3.47`
# (`requires Rust 1.88`). Shipping the security fixes takes priority
# over holding the MSRV at 1.85; 1.88 is the cost of a vuln-free
# locked tree. The NATS path is behind the non-default
# `replication-nats` feature, but `cargo audit` / `cargo deny` scan the
# whole lockfile, so the bump is unconditional.
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/kennguy3n/knowledge"

[workspace.dependencies]
# Errors
thiserror = "2"

# IDs
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Hashing / AEAD / KDF / MAC
#
# `hmac` / `hkdf` / `sha2` are bumped in lockstep because they share
# the same underlying `digest` trait surface. The RustCrypto family
# moved from `digest 0.10` (hmac 0.12 / hkdf 0.12 / sha2 0.10) to
# `digest 0.11` (hmac 0.13 / hkdf 0.13 / sha2 0.11), so any partial
# bump would force two incompatible `digest` versions into the build
# (already partially the case via `ml-dsa`/`shake` which pull in
# `digest 0.11`; the lockstep bump on the user-facing crates lets us
# consume the same generic surface). The only source change required
# by the bump is that `hmac 0.13` moved `Hmac::new_from_slice` from
# an inherent method to a `KeyInit` trait method, so callers must
# `use hmac::KeyInit;` (see `crates/crypto/src/provenance.rs`).
blake3 = "1"
chacha20poly1305 = "0.10"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
# `rand_core` is intentionally kept at 0.6 because `x25519-dalek 2`'s
# `X25519Secret::random_from_rng` and `ml-kem 0.2`'s `KemCore::generate`
# both consume the `rand_core 0.6 CryptoRngCore` trait. Bumping
# `rand_core` past 0.6 would require also bumping `x25519-dalek` and
# `ml-kem`, which is out of scope for this PR. `rand 0.10` is happy
# to coexist with `rand_core 0.6`: the two crates have parallel RNG
# trait hierarchies and our code uses them at distinct call sites
# (PQ-crypto callsites import `rand_core::OsRng` from the 0.6
# surface; everything else uses `rand::rng()` / `rand::rngs::SysRng`
# from 0.10). rand 0.10 renamed `OsRng` to `SysRng`, `RngCore` /
# `TryRngCore` to `Rng` / `TryRng`, and `os_rng` to `sys_rng`; see
# the per-callsite migration notes in `crates/*/src/persist.rs` and
# `crates/evidence_store/src/store.rs`.
rand_core = { version = "0.6", features = ["std"] }
rand = "0.10"

# Post-quantum + classical KEM
x25519-dalek = { version = "3", features = ["static_secrets"] }
ml-kem = { version = "0.2", features = ["std"] }

# Post-quantum signatures (FIPS 204 ML-DSA-65 backend).
# `features = ["zeroize"]` opts the upstream `ml-dsa` crate into the
# `ZeroizeOnDrop` impl on `SigningKey<MlDsa65>` so long-lived secret-
# key state in `MlDsa65Signer` is wiped from memory when dropped.
ml-dsa = { version = "0.1.1", features = ["zeroize"] }

# Stateless hash-based post-quantum signatures
# (SPHINCS+-SHAKE-128f-simple via PQClean).
# `pqcrypto-sphincsplus` wraps the PQClean C reference implementation
# behind a safe Rust API; `pqcrypto-traits` carries the shared
# PublicKey / SecretKey / DetachedSignature trait surface used to
# round-trip wire bytes.
pqcrypto-sphincsplus = "0.7"
pqcrypto-traits = "0.3"

# Storage. Pinned to `0.36` because rusqlite `0.37+` (libsqlite3-sys
# `0.36+`) raised its effective MSRV by adopting the
# `cfg_select!` macro that did not stabilise until Rust 1.94 — well
# beyond the workspace's `MSRV (1.88.0)` CI gate. The `0.36.x` line
# is the last release that still compiles under our pinned
# toolchain.
#
# Bumping rusqlite past `0.36` is gated on a workspace MSRV bump to
# `≥1.94`, which is itself enforced by the `MSRV (1.88.0)` CI job
# in `.github/workflows/ci.yml` (which pins the toolchain via
# `dtolnay/rust-toolchain@1.88.0`). The matching Dependabot ignore
# lives in `.github/dependabot.yml`.
rusqlite = { version = "0.36", features = ["bundled-sqlcipher-vendored-openssl", "blob"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# System / FFI
libc = "0.2"

# Tests
tempfile = "3"
proptest = "1"

# Benchmarks. Held at `0.7`. criterion `0.8.0` raised its MSRV to
# `1.86` (`criterion@0.8.2 requires rustc 1.86`); the workspace MSRV is
# now `1.88` so that gate no longer blocks the bump. It is kept at
# `0.7` deliberately so the `0.7 -> 0.8` benchmark-API migration lands
# as its own reviewable PR rather than riding along an unrelated
# change. `html_reports` emits the per-bench HTML
# output to `target/criterion/` so reviewers can pull a self-contained
# report from a CI artifact without re-running locally.
#
# Note on `black_box`: criterion `0.6` deprecated `criterion::black_box`
# in favour of `std::hint::black_box`. The bench files import
# `black_box` from `std::hint::` directly, which is forward-compatible
# with `0.6` / `0.7` / `0.8` and avoids the deprecation warning under
# `-D warnings`.
#
# The workspace MSRV (1.88, enforced by the `MSRV (1.88.0)` CI job in
# `.github/workflows/ci.yml` via `dtolnay/rust-toolchain@1.88.0`) now
# clears criterion 0.8's `1.86` floor; the remaining hold is the
# benchmark-API migration noted above, tracked as its own PR.
criterion = { version = "0.7", features = ["html_reports"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Language detection — pure-Rust trigram-statistics detector that
# returns an ISO 639-3 enum + a confidence + an `is_reliable`
# heuristic. The substrate uses it inside the
# observation pipeline to stamp every produced `Observation` with a
# BCP-47 primary subtag so the multilingual lexicon registry, the
# CJK-aware FTS5 tokenizer, and the per-language extractor heuristics
# can pick the right per-locale assets without re-running detection
# in every downstream consumer.
#
# Pinned to 0.18 — the current line. Pure Rust, MIT, no I/O, ~2 MB
# embedded model, compatible with the workspace MSRV (1.88). Known
# limitation: 0.18 does not ship classifiers for Tibetan or Lao —
# the FTS routing predicate in `evidence_store::script` keys on
# script presence rather than the language tag, which is the right
# architecture independently and not a workaround we need to lift.
#
# On the latest published version; see `docs/security/dependency-policy.md` for
# the MSRV policy and the future-bump checklist.
whatlang = "0.18"

# Unicode NFC normalization — used by the interrogative first-token
# extractor to handle NFD-decomposed input (e.g. `qué` as
# `q u e \u{0301}`) so accented interrogatives match the NFC-composed
# table entries. Pure Rust, no_std-compatible, MIT. On the latest
# published version; see `docs/security/dependency-policy.md`.
unicode-normalization = "0.1"

# Regex — used by the observation engine's pattern-based entity
# extractors (IBAN, ISIN, SWIFT/BIC, ICD-10, patent numbers, etc.)
# and by the cross-cultural normalisation module. Pure Rust, no
# unsafe, MIT. On the latest published version; see
# `docs/security/dependency-policy.md`.
regex = "1"

# HTTP client. The blocking client is used by the synchronous
# inference path (`inference_router`'s `http-client` feature talks
# to the llama.cpp loopback `llama-server`); the async client is
# used by the async-runtime path (`connector_framework`'s
# `async-http-client` feature + `inference_router`'s
# `async-http-client` feature). Both are gated so cross-checks and
# offline lints that don't link the network stack can still build
# the substrate.
#
# `blocking` is *not* in the workspace-default feature set: consumers
# that need it (the sync `BlockingHttpTransport` and the sync llama
# adapter) opt in via the `reqwest/blocking` feature on their own
# `http-client` Cargo feature. Async-only consumers
# (`async-http-client`) therefore do not transitively pull in
# reqwest's blocking client + its dedicated thread pool, keeping the
# async dependency footprint honest with what `async-http-client`'s
# doc comment promises.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Tokio multi-thread runtime for the async surface. Gated
# behind `[features]` on the crates that opt-in — the synchronous
# core stays free of `tokio` so the crypto / evidence-store /
# memory-manager / observation-engine surface compiles on hosts
# without a tokio toolchain.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "fs"] }

# Async-trait — only required because Rust does not yet allow
# `async fn` in regular traits without an opt-in toolchain bump
# beyond the workspace MSRV (1.88). Once the workspace MSRV reaches
# 1.91 (when the AFIT-via-dyn-trait release lands), this dep can
# be deleted and the `#[async_trait]` annotations removed from
# `connector_framework::AsyncConnector`.
async-trait = "0.1"

# NATS JetStream client for the substrate's active-passive replication
# transport (`crates/substrate_server/src/replication/`). Only linked
# behind `substrate_server`'s NON-default `replication-nats` feature —
# the in-memory transport keeps the default build (and the
# cross-compile `cargo check --workspace` CI checks for
# aarch64-apple-ios / aarch64-linux-android) free of the NATS / rustls
# stack, mirroring the gating on `http-client`. Tracks the `0.49` line:
# `0.46` transitively pinned the unmaintained `rustls-webpki 0.102`,
# which carries four RUSTSEC advisories (RUSTSEC-2026-0049/-0098/-0099/
# -0104 — name-constraint bypasses + a reachable CRL-parsing panic) and
# a `time 0.3.45` DoS (RUSTSEC-2026-0009). `0.49` moves the NATS TLS
# path onto the patched `rustls-webpki 0.103` / `time 0.3.47`, clearing
# all five. This raises the crate's MSRV to `1.88` (see the workspace
# `rust-version` below). async-nats still reuses the `rustls 0.23` /
# `tokio-rustls 0.26` already pulled in via `reqwest`'s `rustls-tls`,
# so it adds no second TLS stack.
async-nats = "0.49"
# `bytes::Bytes` is async-nats' payload type; only linked behind
# `substrate_server`'s `replication-nats` feature alongside async-nats.
bytes = "1"
# `futures` (StreamExt) is required to drain the JetStream message and
# KV-watch streams in the NATS transport. Same `replication-nats`
# gating — the default build never links it.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# Axum + tower for the webhook receiver. Axum is built on
# top of `hyper` 1.x and the `tower` middleware ecosystem. The
# specific features are chosen so the webhook server compiles
# without pulling in tokio macros that the rest of the workspace
# doesn't need.
#
# Axum 0.8 changed the path-pattern syntax: `:capture` is no longer
# accepted at runtime and now panics with "Path segments must not
# start with `:`. For capture groups, use `{capture}`.". The webhook
# router in `connector_framework::webhook_server::build_router`
# defines its provider-id capture as `{provider_id}` to match the
# new syntax.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service", "server-auto"] }

# Structured logging facade. Used at `debug!` level only inside the
# substrate so a host that has not installed a subscriber pays
# nothing at runtime. Specifically wired into the embedding-cache
# write paths so swallowed SQLite errors are observable in
# `RUST_LOG=evidence_store=debug` traces.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# UniFFI — bindings generator for the iOS / Android platform
# integration surface in `crates/ffi`.
#
# The workspace-level declaration is intentionally feature-LEAN.
# Specifically the `cli` feature is NOT enabled here because feature
# unification under Cargo's resolver v2 still unifies regular
# (non-`build-dependencies`) features across all workspace members
# during workspace-wide builds (`cargo build --workspace`,
# `cargo check --workspace`, the MSRV CI job, …). Enabling `cli` at
# the workspace level would therefore compile `clap` / `syn` /
# `quote` / `proc-macro2` into the unified `uniffi` rlib that
# `crates/ffi` consumes for those builds, inflating the
# `staticlib` (iOS `.xcframework`) and `cdylib` (Android `jniLibs/`)
# build's compile time. The `uniffi_bindgen_main()` CLI entry point
# lives in `crates/uniffi-bindgen` (a dedicated binary crate that
# takes the `cli` feature on its own local `uniffi` dependency)
# instead — see `crates/uniffi-bindgen/Cargo.toml` for the
# rationale and the workspace-wide-build caveat.
#
# Per-package builds (`cargo build -p ffi`, `cargo ndk -p ffi`,
# `cargo swift package -p ffi`) — which the mobile build scripts in
# `crates/ffi/scripts/build_{ios,android}.sh` use — sidestep feature
# unification entirely: each crate gets its own per-package
# resolution, so `crates/ffi` sees a `cli`-feature-free `uniffi`
# even when `crates/uniffi-bindgen` has `cli` enabled. The
# linker dead-strips unused symbols from the final on-disk
# artefact in either build mode, so this is a compile-time
# optimisation, not a binary-size guarantee.
#
# The `tokio` feature is intentionally NOT enabled at workspace
# level either — the FFI surface is currently fully synchronous and
# pulling in a tokio dependency through uniffi's async support
# would bloat the mobile static library. If we add async entry
# points later, opt in locally on the `ffi` crate.
uniffi = { version = "0.31" }

# Optional subscriber used by `ffi`'s `tracing-subscriber` feature and
# the `napi_addon`'s `tracing-subscriber` feature. NOT enabled by
# default for any crate — the substrate's library-side default is "no
# subscriber installed, events go nowhere". Hosts opt in explicitly.
# The `env-filter` feature provides the `RUST_LOG`-syntax
# `EnvFilter`; `fmt` provides the stderr formatter used by
# `ffi::tracing_init::try_init_tracing`.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }

[workspace.lints.rust]
# `deny` (rather than `forbid`) so individual crates that need to
# cross an FFI boundary can opt back in via a localized
# `#![allow(unsafe_code)]` on the modules that genuinely need it
# (e.g. `crates/napi/src/bindings.rs`, where `napi-derive`'s
# proc-macros expand into Node-loader stubs that necessarily
# touch raw C pointers). The expectation is that any crate that
# downgrades this also documents the reason inline next to the
# `allow` — see `crates/napi/src/bindings.rs` for the canonical
# pattern. Crates that should never relax this (e.g. `crypto`)
# re-state `unsafe_code = "forbid"` in their own `[lints.rust]`
# block.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Safety-relevant numeric-conversion + comparison lints. All four
# live in `clippy::pedantic` (which is set to `warn` two lines
# above with priority -1), so without the explicit `deny` entries
# below they would each be a warning rather than an error. Pin
# them at `deny` at the default priority so the safety policy is
# declarative in this file rather than only enforced indirectly
# via CI's `-D warnings` flag — a future change to the CI
# invocation must not be able to silently relax these.
#
# Cast sites that legitimately need the lossy / sign-discarding
# behaviour opt in locally with a `#[allow(clippy::cast_…)]`
# attribute next to the cast, justifying the bound in a comment
# — see e.g. `crates/audit_service/src/persist.rs:393` (clamped
# `u64 -> i64` for SQLite row IDs) and the demo crate's crypto
# stage (deterministic test vectors where the cast cannot truncate
# by construction).
#
# Note that `crates/crypto/Cargo.toml` does NOT inherit
# `[lints] workspace = true` — it maintains its own fully
# independent `[lints.clippy]` block and restates all four
# (`cast_possible_truncation` / `cast_sign_loss` /
# `cast_possible_wrap` / `float_cmp`) to `deny` there for the
# same reasons. Every other workspace crate inherits these
# denials via `[lints] workspace = true`.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
float_cmp = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
return_self_not_must_use = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
ignored_unit_patterns = "allow"
explicit_iter_loop = "allow"
needless_raw_string_hashes = "allow"
type_complexity = "allow"
unreadable_literal = "allow"
uninlined_format_args = "allow"
needless_continue = "allow"

