[workspace]
resolver = "2"
exclude = ["crates/crypto/fuzz"]
members = [
    "crates/agent_contract",
    "crates/audit_service",
    "crates/concept_graph",
    "crates/connector_framework",
    "crates/connectors",
    "crates/crypto",
    "crates/demo",
    "crates/evidence_store",
    "crates/export_plane",
    "crates/ffi",
    "crates/inference_router",
    "crates/integration_tests",
    "crates/memory_manager",
    "crates/napi",
    "crates/observation_engine",
    "crates/permission_service",
    "crates/reasoning_engine",
    "crates/sync_engine",
    "crates/synthesis_engine",
    "crates/synthesis_pipeline",
    "crates/tenant_service",
]

[workspace.package]
version = "0.1.0"
# Workspace crates stay on Rust 2021 even though some dependencies
# (notably `ml-dsa = "0.1.0"`) declare `edition = "2024"`. Cargo edition
# is per-crate, not per-dependency-graph — a workspace crate on 2021
# may freely depend on a 2024-edition crate. We keep 2021 here to:
#   1. avoid churn on the `let chain` / `gen` / new safety rules in
#      2024 across the ~20-crate workspace until we have explicit
#      reason to migrate;
#   2. keep the MSRV signalled by `rust-version = "1.85"` honest —
#      1.85 is required by `ml-dsa`'s internal `edition = "2024"`, not
#      by our crates' surface.
# Bump to 2024 in a dedicated PR (so `cargo fix --edition` migration
# noise is reviewable on its own).
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/kennguy3n/knowledge"

[workspace.dependencies]
# Errors
thiserror = "1"

# IDs
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Hashing / AEAD / KDF / MAC
blake3 = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"

# Post-quantum + classical KEM
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = { version = "0.2", features = ["std"] }

# Post-quantum signatures (FIPS 204 ML-DSA-65 backend).
# `features = ["zeroize"]` opts the upstream `ml-dsa` crate into the
# `ZeroizeOnDrop` impl on `SigningKey<MlDsa65>` so long-lived secret-
# key state in `MlDsa65Signer` is wiped from memory when dropped.
ml-dsa = { version = "0.1.0", features = ["zeroize"] }

# Stateless hash-based post-quantum signatures
# (SPHINCS+-SHAKE-128f-simple via PQClean).
# `pqcrypto-sphincsplus` wraps the PQClean C reference implementation
# behind a safe Rust API; `pqcrypto-traits` carries the shared
# PublicKey / SecretKey / DetachedSignature trait surface used to
# round-trip wire bytes.
pqcrypto-sphincsplus = "0.7"
pqcrypto-traits = "0.3"

# Storage
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "blob"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Tests
tempfile = "3"

# Benchmarks. Pinned major version `0.5` to match the criterion API the
# `crates/*/benches/*.rs` harnesses target. `html_reports` emits the
# per-bench HTML output to `target/criterion/` so reviewers can pull a
# self-contained report from a CI artifact without re-running locally.
criterion = { version = "0.5", features = ["html_reports"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client. The blocking client is used by the synchronous
# inference path (`inference_router`'s `http-client` feature talks
# to the llama.cpp loopback `llama-server`); the async client is
# used by the Phase 5 async-runtime path (`connector_framework`'s
# `async-http-client` feature + `inference_router`'s
# `async-http-client` feature). Both are gated so cross-checks and
# offline lints that don't link the network stack can still build
# the substrate.
#
# `blocking` is *not* in the workspace-default feature set: consumers
# that need it (the sync `BlockingHttpTransport` and the sync llama
# adapter) opt in via the `reqwest/blocking` feature on their own
# `http-client` Cargo feature. Async-only consumers
# (`async-http-client`) therefore do not transitively pull in
# reqwest's blocking client + its dedicated thread pool, keeping the
# async dependency footprint honest with what `async-http-client`'s
# doc comment promises.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Tokio multi-thread runtime for the Phase 5 async surface. Gated
# behind `[features]` on the crates that opt-in — the synchronous
# core stays free of `tokio` so the crypto / evidence-store /
# memory-manager / observation-engine surface compiles on hosts
# without a tokio toolchain.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "fs"] }

# Async-trait — only required because Rust does not yet allow
# `async fn` in regular traits without an opt-in toolchain bump
# beyond the workspace MSRV (1.85). Once the workspace MSRV reaches
# 1.91 (when the AFIT-via-dyn-trait release lands), this dep can
# be deleted and the `#[async_trait]` annotations removed from
# `connector_framework::AsyncConnector`.
async-trait = "0.1"

# Axum + tower for the Phase 5 webhook receiver. Axum is built on
# top of `hyper` 1.x and the `tower` middleware ecosystem. The
# specific features are chosen so the webhook server compiles
# without pulling in tokio macros that the rest of the workspace
# doesn't need.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service", "server-auto"] }

# Structured logging facade. Used at `debug!` level only inside the
# substrate so a host that has not installed a subscriber pays
# nothing at runtime. Specifically wired into the embedding-cache
# write paths so swallowed SQLite errors are observable in
# `RUST_LOG=evidence_store=debug` traces.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Optional subscriber used by `ffi`'s `tracing-subscriber` feature and
# the `napi_addon`'s `tracing-subscriber` feature. NOT enabled by
# default for any crate — the substrate's library-side default is "no
# subscriber installed, events go nowhere". Hosts opt in explicitly.
# The `env-filter` feature provides the `RUST_LOG`-syntax
# `EnvFilter`; `fmt` provides the stderr formatter used by
# `ffi::tracing_init::try_init_tracing`.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }

[workspace.lints.rust]
# `deny` (rather than `forbid`) so individual crates that need to
# cross an FFI boundary can opt back in via a localized
# `#![allow(unsafe_code)]` on the modules that genuinely need it
# (e.g. `crates/napi/src/bindings.rs`, where `napi-derive`'s
# proc-macros expand into Node-loader stubs that necessarily
# touch raw C pointers). The expectation is that any crate that
# downgrades this also documents the reason inline next to the
# `allow` — see `crates/napi/src/bindings.rs` for the canonical
# pattern. Crates that should never relax this (e.g. `crypto`)
# re-state `unsafe_code = "forbid"` in their own `[lints.rust]`
# block.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
return_self_not_must_use = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
ignored_unit_patterns = "allow"
explicit_iter_loop = "allow"
needless_raw_string_hashes = "allow"
type_complexity = "allow"
unreadable_literal = "allow"
uninlined_format_args = "allow"
needless_continue = "allow"
