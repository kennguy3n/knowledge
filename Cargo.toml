[workspace]
resolver = "2"
exclude = ["crates/crypto/fuzz"]
members = [
    "crates/agent_contract",
    "crates/audit_service",
    "crates/concept_graph",
    "crates/connector_framework",
    "crates/connectors",
    "crates/crypto",
    "crates/demo",
    "crates/evidence_store",
    "crates/export_plane",
    "crates/ffi",
    "crates/inference_router",
    "crates/integration_tests",
    "crates/memory_manager",
    "crates/napi",
    "crates/observation_engine",
    "crates/permission_service",
    "crates/reasoning_engine",
    "crates/sync_engine",
    "crates/synthesis_engine",
    "crates/synthesis_pipeline",
    "crates/tenant_service",
]

[workspace.package]
version = "0.1.0"
# Workspace crates stay on Rust 2021 even though some dependencies
# (notably `ml-dsa = "0.1.0"`) declare `edition = "2024"`. Cargo edition
# is per-crate, not per-dependency-graph — a workspace crate on 2021
# may freely depend on a 2024-edition crate. We keep 2021 here to:
#   1. avoid churn on the `let chain` / `gen` / new safety rules in
#      2024 across the ~20-crate workspace until we have explicit
#      reason to migrate;
#   2. keep the MSRV signalled by `rust-version = "1.85"` honest —
#      1.85 is required by `ml-dsa`'s internal `edition = "2024"`, not
#      by our crates' surface.
# Bump to 2024 in a dedicated PR (so `cargo fix --edition` migration
# noise is reviewable on its own).
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/kennguy3n/knowledge"

[workspace.dependencies]
# Errors
thiserror = "1"

# IDs
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Hashing / AEAD / KDF / MAC
blake3 = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"

# Post-quantum + classical KEM
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = { version = "0.2", features = ["std"] }

# Post-quantum signatures (FIPS 204 ML-DSA-65 backend).
# `features = ["zeroize"]` opts the upstream `ml-dsa` crate into the
# `ZeroizeOnDrop` impl on `SigningKey<MlDsa65>` so long-lived secret-
# key state in `MlDsa65Signer` is wiped from memory when dropped.
ml-dsa = { version = "0.1.0", features = ["zeroize"] }

# Stateless hash-based post-quantum signatures
# (SPHINCS+-SHAKE-128f-simple via PQClean).
# `pqcrypto-sphincsplus` wraps the PQClean C reference implementation
# behind a safe Rust API; `pqcrypto-traits` carries the shared
# PublicKey / SecretKey / DetachedSignature trait surface used to
# round-trip wire bytes.
pqcrypto-sphincsplus = "0.7"
pqcrypto-traits = "0.3"

# Storage
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "blob"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Tests
tempfile = "3"

# Benchmarks. Pinned major version `0.5` to match the criterion API the
# `crates/*/benches/*.rs` harnesses target. `html_reports` emits the
# per-bench HTML output to `target/criterion/` so reviewers can pull a
# self-contained report from a CI artifact without re-running locally.
criterion = { version = "0.5", features = ["html_reports"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (used by `inference_router`'s `http-client` feature to
# talk to the llama.cpp loopback `llama-server`). Blocking +
# rustls-tls so we don't pull in tokio for the synchronous
# inference path.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Structured logging facade. Used at `debug!` level only inside the
# substrate so a host that has not installed a subscriber pays
# nothing at runtime. Specifically wired into the embedding-cache
# write paths so swallowed SQLite errors are observable in
# `RUST_LOG=evidence_store=debug` traces.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
return_self_not_must_use = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
ignored_unit_patterns = "allow"
explicit_iter_loop = "allow"
needless_raw_string_hashes = "allow"
type_complexity = "allow"
unreadable_literal = "allow"
uninlined_format_args = "allow"
needless_continue = "allow"
