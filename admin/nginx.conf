# nginx config for the Knowledge admin SPA.
#
# - Serves the built static bundle on port 3001 with SPA history
#   fallback (client-side routing under react-router).
# - Reverse-proxies the gateway API surface (/api, /health, /metrics)
#   to the compose service `knowledge-gateway:8080` so the SPA can call
#   it same-origin without CORS.
#
# The upstream is resolved at request time via Docker's embedded DNS
# (127.0.0.11) so nginx starts even when the gateway is not yet up, and
# picks up the gateway's address once it becomes healthy.

server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker Compose embedded DNS. Harmless outside compose (proxied
    # requests simply 502 if the name does not resolve).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway "knowledge-gateway:8080";

    # SSE for synthesis status streaming needs buffering disabled.
    location /api/ {
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass http://$gateway/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /metrics {
        proxy_pass http://$gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static assets with long cache; the index is always revalidated.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
