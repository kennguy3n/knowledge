# Machine-readable single source of truth for per-crate status.
# Keep this in sync with MODULE_STATUS.md and PROGRESS.md.

[crate.agent_contract]
category = "runtime-ready"
status = "Real implementation — capability tokens, audit hooks, scope binding."

[crate.audit_service]
category = "runtime-ready"
status = "Append-only audit log over SQLCipher."

[crate.concept_graph]
category = "runtime-ready"
status = "Concept extraction, edge typing, hierarchy enforcement. SQL-backed indices."

[crate.connector_framework]
