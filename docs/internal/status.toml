[crate.demo]
category = "mock-test-demo"
status = "CLI demo binary wiring TestSigner + NoOpSynthesizer + MockTeeRuntime."

[crate.evidence_store]
category = "runtime-ready"
status = "Real SQLCipher, per-scope AEAD, content-hash dedup with per-scope CEK wrapping, ring buffer FIFO, FTS5."
notes = "FTS5 purged on forget via purge_fts_for_scope. Embedding pipeline is a skeleton."

[crate.export_plane]
category = "runtime-ready"
status = "Agent-facing read APIs, scope enforcement, redaction."

[crate.ffi]
category = "partial-runtime"
status = "Phase A.5: core evidence/crypto/memory functions wired; synthesis unavailable."
wired_exports = [
    "open_store", "close_store", "ingest_message", "query", "get_evidence",
    "forget", "forget_scope", "encrypt", "decrypt", "generate_keypair",
    "get_user_memory", "pin", "unpin", "list_memories", "run_decay_sweep",
    "get_channel_memory", "escape_fts_query",
]
unavailable_exports = ["trigger_synthesis"]

